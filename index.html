<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps by AI</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" sizes="any" href="favicons/apps-by-ai.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="manifest" href="favicons/site.webmanifest">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scrollbar-gutter: stable;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            color: #e0e0e0;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 24px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #666;
        }

        .header-search {
            width: 280px;
        }

        .header-search .search-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .header-search .search-input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .header-search .search-input::placeholder {
            color: #666;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .header-search {
                width: 100%;
            }
        }

        .filters {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 16px;
        }

        .filter-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 16px;
            margin-bottom: 10px;
        }

        .filter-controls label {
            color: #aaa;
            font-size: .85rem;
        }

        .filter-controls select, #activeTags button {
            background: #242424;
            border: 1px solid #444;
            border-radius: 4px;
            color: #ddd;
            padding: 5px 8px;
            font: inherit;
        }

        #activeTags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        #activeTags button {
            cursor: pointer;
            font-size: .8rem;
        }

        .results-count {
            text-align: center;
            color: #555;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-description {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .card-category {
            color: #aaa;
            font-size: .75rem;
        }

        .card-rating {
            margin-left: auto;
            color: #666;
            font-size: 0.65rem;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .card-rating .filled {
            color: #f1c40f;
        }

        .card-link {
            color: #555;
            font-size: 0.7rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: auto;
            padding: 4px 8px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .card-link:hover {
            color: #888;
            background: rgba(255, 255, 255, 0.05);
        }

        .card-link svg {
            width: 12px;
            height: 12px;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #555;
            font-size: 0.8rem;
        }

        footer a {
            color: #666;
            text-decoration: none;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>Apps by AI</h1>
            <p class="subtitle">A Collection of AI-generated Apps</p>
        </div>
        <div class="header-search">
            <input type="text" class="search-input" id="search" placeholder="Search apps...">
        </div>
    </header>

    <nav aria-label="Site sections" style="max-width:1200px;margin:0 auto;padding:0 24px 20px;display:flex;gap:24px;font-size:14px;"><a href="index.html" aria-current="page" style="color:#e0e0e0;">Apps</a><a href="games/index.html" style="color:#e0e0e0;">Games</a><a href="notes/index.html" style="color:#e0e0e0;">Notes</a><a href="music/index.html" style="color:#e0e0e0;">Music</a></nav>

    <div class="filters">
        <div class="filter-controls">
            <label>Category <select id="category"><option value="">All categories</option></select></label>
            <label>Tag <select id="tag"><option value="">Choose a tag</option></select></label>
        </div>
        <div id="activeTags" aria-label="Selected tags"></div>
        <div class="results-count" id="resultsCount"></div>
    </div>

    <main class="gallery" id="gallery">
    </main>

    <footer>
        <p>Built with AI • <a href="https://github.com/lawrencehook/ai-showcase" target="_blank">View on GitHub</a></p>
    </footer>

    <script>
        let allApps = [];
        let allTags = [];
        let allCategories = [];
        let selectedTags = new Set();
        let selectedCategory = null;
        let searchQuery = '';

        function esc(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Load filters from URL params
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);

            if (allCategories.includes(params.get('category'))) {
                selectedCategory = params.get('category');
            }

            if (params.get('tags')) {
                params.get('tags').split(',').forEach(tag => {
                    let name = tag.trim();
                    try { name = decodeURIComponent(name); } catch (e) {}
                    if (allTags.includes(name)) selectedTags.add(name);
                });
            }

            if (params.get('q')) {
                searchQuery = params.get('q');
                document.getElementById('search').value = searchQuery;
            }


        }

        // Update URL with current filters
        function updateURL() {
            const params = new URLSearchParams();

            if (selectedCategory) {
                params.set('category', selectedCategory);
            }

            if (selectedTags.size > 0) {
                params.set('tags', Array.from(selectedTags).map(t => encodeURIComponent(t)).join(','));
            }

            if (searchQuery) {
                params.set('q', searchQuery);
            }

            const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
            window.history.replaceState({}, '', newURL);
        }

        async function loadApps() {
            try {
                const response = await fetch('metadata.json');
                if (!response.ok) throw new Error(`metadata.json: HTTP ${response.status}`);
                // One malformed entry must not blank the whole gallery
                allApps = (await response.json()).filter(app => app && app.title && app.path);
                allApps.forEach(app => {
                    app.description = app.description || '';
                    app.tags = Array.isArray(app.tags) ? app.tags : [];
                });

                // Extract all unique categories
                const categorySet = new Set();
                allApps.forEach(app => {
                    if (app.category) categorySet.add(app.category);
                });
                allCategories = Array.from(categorySet).sort();

                // Extract all unique tags
                const tagSet = new Set();
                allApps.forEach(app => app.tags.forEach(tag => tagSet.add(tag)));
                allTags = Array.from(tagSet).sort();

                loadFromURL();
                const category = document.getElementById('category');
                allCategories.forEach(name => category.add(new Option(name, name)));
                category.value = selectedCategory || '';
                filterAndRender();
            } catch (error) {
                console.error('Failed to load metadata:', error);
                document.getElementById('gallery').innerHTML = `
                    <div class="empty-state">
                        <p>Failed to load applications. Make sure metadata.json exists.</p>
                    </div>
                `;
            }
        }

        document.getElementById('category').addEventListener('change', event => {
            selectedCategory = event.target.value || null;
            selectedTags.clear();
            filterAndRender();
            updateURL();
        });

        document.getElementById('tag').addEventListener('change', event => {
            if (event.target.value) selectedTags.add(event.target.value);
            filterAndRender();
            updateURL();
        });

        function filterAndRender() {
            let filtered = allApps;

            // Filter by search query
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(app =>
                    app.title.toLowerCase().includes(query) ||
                    app.description.toLowerCase().includes(query) ||
                    (app.category && app.category.toLowerCase().includes(query)) ||
                    app.tags.some(tag => tag.toLowerCase().includes(query))
                );
            }

            // Filter by selected category
            if (selectedCategory) {
                filtered = filtered.filter(app => app.category === selectedCategory);
            }

            // Filter by selected tags
            if (selectedTags.size > 0) {
                filtered = filtered.filter(app =>
                    Array.from(selectedTags).every(tag => app.tags.includes(tag))
                );
            }

            const available = new Set(filtered.flatMap(app => app.tags));
            const tag = document.getElementById('tag');
            tag.replaceChildren(new Option('Choose a tag', ''));
            for (const name of allTags) {
                if (available.has(name) && !selectedTags.has(name)) tag.add(new Option(name, name));
            }
            tag.disabled = tag.options.length === 1;

            const activeTags = document.getElementById('activeTags');
            activeTags.replaceChildren();
            for (const name of selectedTags) {
                const button = document.createElement('button');
                button.textContent = name + ' ×';
                button.setAttribute('aria-label', 'Remove tag ' + name);
                button.onclick = () => {
                    selectedTags.delete(name);
                    filterAndRender();
                    updateURL();
                    document.getElementById('tag').focus();
                };
                activeTags.append(button);
            }

            renderApps(filtered);

            // Update results count
            const countEl = document.getElementById('resultsCount');
            if (searchQuery || selectedCategory || selectedTags.size > 0) {
                countEl.textContent = `Showing ${filtered.length} of ${allApps.length} apps`;
            } else {
                countEl.textContent = '';
            }
        }

        function renderApps(apps) {
            const gallery = document.getElementById('gallery');

            // Sort alphabetically by title
            apps = [...apps].sort((a, b) => a.title.localeCompare(b.title));

            if (apps.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <p>No matching apps found.</p>
                    </div>
                `;
                return;
            }

            gallery.innerHTML = apps.map(app => `
                <a href="${esc(app.path)}" class="card">
                    <div class="card-icon" style="${app.previewGradient ? `background: ${esc(app.previewGradient)}` : 'background: #333'}">
                        ${esc(app.emoji || '🤖')}
                    </div>
                    <div class="card-content">
                        <h2 class="card-title">${esc(app.title)}</h2>
                        <p class="card-description">${esc(app.description)}</p>
                        <div class="card-meta">
                            ${app.category ? `<span class="card-category">${esc(app.category)}</span>` : ''}
                            ${[1, 2, 3, 4, 5].includes(app.completeness) ? `<span class="card-rating" title="Completeness: ${app.completeness}/5"><span class="filled">${'★'.repeat(app.completeness)}</span>${'★'.repeat(5 - app.completeness)}</span>` : ''}
                        </div>
                    </div>
                    ${app.link ? `
                        <span class="card-link" data-link="${esc(app.link)}" onclick="event.preventDefault(); event.stopPropagation(); window.open(this.dataset.link, '_blank', 'noopener');">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                <polyline points="15 3 21 3 21 9"></polyline>
                                <line x1="10" y1="14" x2="21" y2="3"></line>
                            </svg>
                            Info
                        </span>
                    ` : ''}
                </a>
            `).join('');
        }

        // Search input handler
        document.getElementById('search').addEventListener('input', e => {
            searchQuery = e.target.value;
            filterAndRender();
            updateURL();
        });

        loadApps();
    </script>
</body>
</html>
