<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Decoder - AI Showcase</title><script src="../../site-theme.js"></script>
    <link rel="icon" href="../../favicons/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: light-dark(#efeff3, #0a0a0f);
            min-height: 100vh;
            color: light-dark(#2c2c2c, #e0e0e0);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: light-dark(#0f0f0f, #fff); }
        .subtitle { color: light-dark(#616161, #666); margin-bottom: 32px; }
        .back-link {
            position: fixed; top: 20px; right: 20px; color: light-dark(#616161, #666); text-decoration: none;
            font-size: 14px; padding: 8px 14px; background: light-dark(#fcfcfcd9, rgba(0,0,0,0.85));
            border-radius: 6px; border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
        }
        .back-link:hover { color: light-dark(#0f0f0f, #fff); }
        .input-section {
            background: light-dark(#0f0f0f08, rgba(255,255,255,0.03));
            border: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .input-header {
            padding: 12px 16px;
            background: light-dark(#fcfcfc4c, rgba(0,0,0,0.3));
            border-bottom: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .input-title { color: light-dark(#616161, #888); font-size: 0.9rem; }
        .sample-btn {
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
            color: light-dark(#616161, #888);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .sample-btn:hover { color: light-dark(#0f0f0f, #fff); }
        textarea {
            width: 100%;
            min-height: 120px;
            background: transparent;
            border: none;
            color: light-dark(#2c2c2c, #e0e0e0);
            padding: 16px;
            font-size: 0.9rem;
            line-height: 1.6;
            resize: vertical;
            font-family: 'SF Mono', Monaco, monospace;
            word-break: break-all;
        }
        textarea:focus { outline: none; }
        textarea::placeholder { color: light-dark(#bdbdbd, #444); }
        .error-message {
            padding: 12px 16px;
            background: light-dark(#9613131a, rgba(255, 107, 107, 0.1));
            border-top: 1px solid light-dark(#96131333, rgba(255, 107, 107, 0.2));
            color: light-dark(#961313, #ff6b6b);
            font-size: 0.85rem;
            display: none;
        }
        .jwt-visual {
            padding: 16px;
            background: light-dark(#fcfcfc33, rgba(0,0,0,0.2));
            border-top: 1px solid light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.85rem;
            word-break: break-all;
            line-height: 1.6;
        }
        .jwt-header-part { color: light-dark(#961313, #ff6b6b); }
        .jwt-payload-part { color: light-dark(#76328a, #c678dd); }
        .jwt-signature-part { color: light-dark(#378b85, #4ecdc4); }
        .jwt-dot { color: light-dark(#616161, #888); }
        .decoded-sections {
            display: grid;
            gap: 16px;
        }
        .decoded-section {
            background: light-dark(#0f0f0f08, rgba(255,255,255,0.03));
            border: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            border-radius: 8px;
            overflow: hidden;
        }
        .decoded-section.header { border-left: 3px solid light-dark(#961313, #ff6b6b); }
        .decoded-section.payload { border-left: 3px solid light-dark(#76328a, #c678dd); }
        .decoded-section.signature { border-left: 3px solid light-dark(#44aea6, #4ecdc4); }
        .section-header {
            padding: 12px 16px;
            background: light-dark(#fcfcfc4c, rgba(0,0,0,0.3));
            border-bottom: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title { font-weight: 500; font-size: 0.9rem; }
        .section-title.header { color: light-dark(#961313, #ff6b6b); }
        .section-title.payload { color: light-dark(#76328a, #c678dd); }
        .section-title.signature { color: light-dark(#378b85, #4ecdc4); }
        .copy-btn {
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
            color: light-dark(#616161, #888);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .copy-btn:hover { color: light-dark(#0f0f0f, #fff); }
        .section-content {
            padding: 16px;
        }
        .json-content {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .json-key { color: light-dark(#923037, #e06c75); }
        .json-string { color: light-dark(#5c7e44, #98c379); }
        .json-number { color: light-dark(#8a6038, #d19a66); }
        .json-boolean { color: light-dark(#3d7d84, #56b6c2); }
        .claim-info {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
        }
        .claim-item {
            display: flex;
            gap: 12px;
            padding: 6px 0;
            font-size: 0.85rem;
        }
        .claim-name { color: light-dark(#616161, #666); min-width: 80px; }
        .claim-value { color: light-dark(#2c2c2c, #e0e0e0); }
        .claim-value.expired { color: light-dark(#961313, #ff6b6b); }
        .claim-value.valid { color: light-dark(#378b85, #4ecdc4); }
        .signature-note {
            color: light-dark(#616161, #666);
            font-size: 0.85rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-link">← Back</a>
    <div class="container">
        <h1>JWT Decoder</h1>
        <p class="subtitle">Decode and inspect JSON Web Tokens (JWT) without verification.</p>

        <div class="input-section">
            <div class="input-header">
                <span class="input-title">Paste JWT Token</span>
                <button class="sample-btn" id="sampleBtn">Load Sample</button>
            </div>
            <textarea id="jwtInput" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"></textarea>
            <div class="jwt-visual" id="jwtVisual"></div>
            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="decoded-sections" id="decodedSections">
            <div class="decoded-section header">
                <div class="section-header">
                    <span class="section-title header">HEADER</span>
                    <button class="copy-btn" id="copyHeader">Copy</button>
                </div>
                <div class="section-content">
                    <div class="json-content" id="headerContent">-</div>
                </div>
            </div>

            <div class="decoded-section payload">
                <div class="section-header">
                    <span class="section-title payload">PAYLOAD</span>
                    <button class="copy-btn" id="copyPayload">Copy</button>
                </div>
                <div class="section-content">
                    <div class="json-content" id="payloadContent">-</div>
                    <div class="claim-info" id="claimInfo" style="display: none;"></div>
                </div>
            </div>

            <div class="decoded-section signature">
                <div class="section-header">
                    <span class="section-title signature">SIGNATURE</span>
                </div>
                <div class="section-content">
                    <div id="signatureContent">-</div>
                    <p class="signature-note">Note: Signature is not verified. This tool only decodes the token.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const jwtInput = document.getElementById('jwtInput');
        const jwtVisual = document.getElementById('jwtVisual');
        const errorMessage = document.getElementById('errorMessage');
        const headerContent = document.getElementById('headerContent');
        const payloadContent = document.getElementById('payloadContent');
        const signatureContent = document.getElementById('signatureContent');
        const claimInfo = document.getElementById('claimInfo');

        let decodedHeader = null;
        let decodedPayload = null;

        function base64UrlDecode(str) {
            // Add padding
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) {
                str += '=';
            }
            const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function formatJson(obj) {
            const raw = JSON.stringify(obj, null, 2);
            // Tokenize so digits/keywords inside strings are never re-highlighted
            return raw.replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g, (m, str, colon, bool) => {
                if (str) return `<span class="${colon ? 'json-key' : 'json-string'}">${escapeHtml(str)}</span>${colon || ''}`;
                if (bool) return `<span class="json-boolean">${m}</span>`;
                return `<span class="json-number">${m}</span>`;
            });
        }

        function formatTimestamp(ts) {
            const date = new Date(ts * 1000);
            return date.toLocaleString();
        }

        function clearDecoded() {
            decodedHeader = null;
            decodedPayload = null;
            headerContent.textContent = '-';
            payloadContent.textContent = '-';
            signatureContent.textContent = '-';
            claimInfo.style.display = 'none';
        }

        function decodeJwt() {
            const token = jwtInput.value.trim();
            errorMessage.style.display = 'none';

            if (!token) {
                jwtVisual.innerHTML = '<span style="color: #444;">Token visualization will appear here</span>';
                clearDecoded();
                return;
            }

            const parts = token.split('.');

            if (parts.length !== 3) {
                errorMessage.textContent = 'Invalid JWT format. A JWT should have 3 parts separated by dots.';
                errorMessage.style.display = 'block';
                jwtVisual.textContent = '';
                clearDecoded();
                return;
            }

            // Visualize parts
            jwtVisual.innerHTML = `<span class="jwt-header-part">${escapeHtml(parts[0])}</span><span class="jwt-dot">.</span><span class="jwt-payload-part">${escapeHtml(parts[1])}</span><span class="jwt-dot">.</span><span class="jwt-signature-part">${escapeHtml(parts[2])}</span>`;

            try {
                // Decode header
                decodedHeader = JSON.parse(base64UrlDecode(parts[0]));
                headerContent.innerHTML = formatJson(decodedHeader);

                // Decode payload
                decodedPayload = JSON.parse(base64UrlDecode(parts[1]));
                payloadContent.innerHTML = formatJson(decodedPayload);

                // Show claim info
                const claims = [];
                const now = Math.floor(Date.now() / 1000);

                if (decodedPayload.iat) {
                    claims.push({
                        name: 'Issued At',
                        value: formatTimestamp(decodedPayload.iat)
                    });
                }

                if (decodedPayload.exp) {
                    const isExpired = decodedPayload.exp < now;
                    claims.push({
                        name: 'Expires',
                        value: formatTimestamp(decodedPayload.exp) + (isExpired ? ' (EXPIRED)' : ' (Valid)'),
                        class: isExpired ? 'expired' : 'valid'
                    });
                }

                if (decodedPayload.nbf) {
                    const isValid = decodedPayload.nbf <= now;
                    claims.push({
                        name: 'Not Before',
                        value: formatTimestamp(decodedPayload.nbf) + (isValid ? '' : ' (Not yet valid)'),
                        class: isValid ? 'valid' : 'expired'
                    });
                }

                if (decodedPayload.sub) {
                    claims.push({ name: 'Subject', value: escapeHtml(String(decodedPayload.sub)) });
                }

                if (decodedPayload.iss) {
                    claims.push({ name: 'Issuer', value: escapeHtml(String(decodedPayload.iss)) });
                }

                if (decodedPayload.aud) {
                    const audValue = Array.isArray(decodedPayload.aud) ? decodedPayload.aud.join(', ') : decodedPayload.aud;
                    claims.push({ name: 'Audience', value: escapeHtml(String(audValue)) });
                }

                if (claims.length > 0) {
                    claimInfo.innerHTML = claims.map(c => `
                        <div class="claim-item">
                            <span class="claim-name">${c.name}:</span>
                            <span class="claim-value ${c.class || ''}">${c.value}</span>
                        </div>
                    `).join('');
                    claimInfo.style.display = 'block';
                } else {
                    claimInfo.style.display = 'none';
                }

                // Signature (just show base64)
                signatureContent.innerHTML = `<code style="word-break: break-all; color: #4ecdc4;">${escapeHtml(parts[2])}</code>`;

            } catch (e) {
                clearDecoded();
                errorMessage.textContent = 'Error decoding token: ' + e.message;
                errorMessage.style.display = 'block';
            }
        }

        jwtInput.addEventListener('input', decodeJwt);

        document.getElementById('sampleBtn').addEventListener('click', () => {
            // Generate a sample JWT (this is not a real signed token)
            const header = { alg: 'HS256', typ: 'JWT' };
            const payload = {
                sub: '1234567890',
                name: 'John Doe',
                email: 'john@example.com',
                role: 'admin',
                iat: Math.floor(Date.now() / 1000) - 3600,
                exp: Math.floor(Date.now() / 1000) + 3600
            };

            const encodeBase64Url = (obj) => {
                return btoa(JSON.stringify(obj))
                    .replace(/\+/g, '-')
                    .replace(/\//g, '_')
                    .replace(/=+$/, '');
            };

            const headerB64 = encodeBase64Url(header);
            const payloadB64 = encodeBase64Url(payload);
            const signature = 'SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c';

            jwtInput.value = `${headerB64}.${payloadB64}.${signature}`;
            decodeJwt();
        });

        function copyWithFeedback(btn, text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopyFeedback(btn);
                }).catch(() => {
                    fallbackCopy(btn, text);
                });
            } else {
                fallbackCopy(btn, text);
            }
        }

        function fallbackCopy(btn, text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showCopyFeedback(btn);
        }

        function showCopyFeedback(btn) {
            const original = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = original, 1500);
        }

        document.getElementById('copyHeader').addEventListener('click', function() {
            if (decodedHeader) {
                copyWithFeedback(this, JSON.stringify(decodedHeader, null, 2));
            }
        });

        document.getElementById('copyPayload').addEventListener('click', function() {
            if (decodedPayload) {
                copyWithFeedback(this, JSON.stringify(decodedPayload, null, 2));
            }
        });
    </script>
</body>
</html>
