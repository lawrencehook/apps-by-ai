<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Studio - AI Showcase</title><script src="../../site-theme.js"></script>
    <link rel="icon" href="../../favicons/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: light-dark(#efeff3, #0a0a0f);
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            color: light-dark(#0f0f0f, #fff);
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
        }
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        h1 { font-size: 1.5rem; }
        .back-link {
            color: light-dark(#616161, #666); text-decoration: none;
            font-size: 14px; padding: 8px 14px; background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border-radius: 6px; border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
        }
        .back-link:hover { color: light-dark(#0f0f0f, #fff); }
        .panel {
            background: light-dark(#0f0f0f08, rgba(255,255,255,0.03));
            border: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            border-radius: 12px;
            padding: 24px;
        }
        .panel h2 {
            font-size: 1rem;
            margin-bottom: 20px;
            color: light-dark(#616161, #888);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }
        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: light-dark(#5e5e5e, #aaa);
            font-size: 13px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: light-dark(#fcfcfc4c, rgba(0,0,0,0.3));
            border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
            border-radius: 6px;
            color: light-dark(#0f0f0f, #fff);
            font-size: 14px;
            font-family: inherit;
        }
        textarea { min-height: 80px; resize: vertical; }
        input:focus, textarea:focus {
            outline: none;
            border-color: light-dark(#133f9c80, rgba(100, 150, 255, 0.5));
        }
        input[type="color"] {
            width: 50px;
            height: 36px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }
        input[type="range"] { width: 100%; }
        .color-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .color-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .color-item span { font-size: 11px; color: light-dark(#616161, #666); }
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
            border-radius: 6px;
            color: light-dark(#616161, #888);
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            transition: all 0.2s;
        }
        .tab:hover { background: light-dark(#0f0f0f14, rgba(255,255,255,0.08)); }
        .tab.active {
            background: light-dark(#133f9c33, rgba(100, 150, 255, 0.2));
            border-color: light-dark(#133f9c66, rgba(100, 150, 255, 0.4));
            color: light-dark(#0f0f0f, #fff);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        #qrCanvas {
            background: light-dark(#0f0f0f, #fff);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            background: light-dark(#133f9c33, rgba(100, 150, 255, 0.2));
            border: 1px solid light-dark(#133f9c66, rgba(100, 150, 255, 0.4));
            color: light-dark(#0f0f0f, #fff);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        button:hover {
            background: light-dark(#133f9c4c, rgba(100, 150, 255, 0.3));
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary {
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border-color: light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
        }
        .style-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .preset {
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .preset:hover { transform: scale(1.05); }
        .preset.active { border-color: light-dark(#1652b1, #4a90ff); }
        .logo-upload {
            border: 2px dashed light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logo-upload:hover {
            border-color: light-dark(#0f0f0f4c, rgba(255,255,255,0.3));
            background: light-dark(#0f0f0f05, rgba(255,255,255,0.02));
        }
        .logo-upload input { display: none; }
        .logo-preview {
            max-width: 80px;
            max-height: 80px;
            margin-top: 10px;
            border-radius: 4px;
        }
        #scanResult {
            padding: 15px;
            background: light-dark(#27e4711a, rgba(0,255,100,0.1));
            border: 1px solid light-dark(#27e4714c, rgba(0,255,100,0.3));
            border-radius: 8px;
            margin-top: 15px;
            word-break: break-all;
            display: none;
        }
        #scanResult.error {
            background: light-dark(#9c13131a, rgba(255,100,100,0.1));
            border-color: light-dark(#9c13134c, rgba(255,100,100,0.3));
        }
        #videoContainer {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            display: none;
        }
        #scanVideo {
            width: 100%;
            border-radius: 8px;
        }
        .scan-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 200px;
            border: 2px solid light-dark(#27e47180, rgba(0, 255, 100, 0.5));
            border-radius: 12px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
    <script src="../../libs/qrcode-generator-1.4.4/qrcode.js"></script>
    <script src="../../libs/jsqr-1.4.0/jsQR.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QR Code Studio</h1>
            <a href="../../index.html" class="back-link">← Back</a>
        </div>

        <div class="panel">
            <div class="tabs">
                <div class="tab active" data-tab="generate">Generate</div>
                <div class="tab" data-tab="scan">Scan</div>
            </div>

            <div id="generateTab" class="tab-content active">
                <h2>Content</h2>
                <div class="control-group">
                    <label>Content Type</label>
                    <div class="tabs" style="margin-bottom: 15px;">
                        <div class="tab active" data-type="text">Text/URL</div>
                        <div class="tab" data-type="wifi">WiFi</div>
                        <div class="tab" data-type="vcard">Contact</div>
                    </div>
                </div>

                <div id="textInput" class="control-group">
                    <label for="content">Text or URL</label>
                    <textarea id="content" placeholder="Enter text, URL, or any data...">https://example.com</textarea>
                </div>

                <div id="wifiInput" class="control-group" style="display: none;">
                    <label for="wifiSsid">Network Name (SSID)</label>
                    <input type="text" id="wifiSsid" placeholder="MyNetwork">
                    <label for="wifiPassword" style="margin-top: 12px;">Password</label>
                    <input type="text" id="wifiPassword" placeholder="Password">
                    <label for="wifiSecurity" style="margin-top: 12px;">Security</label>
                    <select id="wifiSecurity" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: light-dark(#0f0f0f, #fff);">
                        <option value="WPA">WPA/WPA2</option>
                        <option value="WEP">WEP</option>
                        <option value="nopass">None</option>
                    </select>
                </div>

                <div id="vcardInput" class="control-group" style="display: none;">
                    <label for="vcardName">Full Name</label>
                    <input type="text" id="vcardName" placeholder="John Doe">
                    <label for="vcardPhone" style="margin-top: 12px;">Phone</label>
                    <input type="text" id="vcardPhone" placeholder="+1 234 567 8900">
                    <label for="vcardEmail" style="margin-top: 12px;">Email</label>
                    <input type="text" id="vcardEmail" placeholder="john@example.com">
                </div>

                <h2 style="margin-top: 30px;">Style</h2>
                <div class="control-group">
                    <label>Presets</label>
                    <div class="style-presets">
                        <div class="preset active" data-preset="classic" style="background: #fff;">⬛</div>
                        <div class="preset" data-preset="ocean" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">🌊</div>
                        <div class="preset" data-preset="sunset" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">🌅</div>
                        <div class="preset" data-preset="forest" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">🌲</div>
                        <div class="preset" data-preset="midnight" style="background: linear-gradient(135deg, #232526 0%, #414345 100%);">🌙</div>
                        <div class="preset" data-preset="gold" style="background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);">✨</div>
                        <div class="preset" data-preset="neon" style="background: #000;">💜</div>
                        <div class="preset" data-preset="custom" style="background: linear-gradient(45deg, #666, #888);">🎨</div>
                    </div>
                </div>

                <div id="customColors" style="display: none;">
                    <div class="control-group">
                        <label>Colors</label>
                        <div class="color-row">
                            <div class="color-item">
                                <input type="color" id="fgColor" value="#000000">
                                <span>Foreground</span>
                            </div>
                            <div class="color-item">
                                <input type="color" id="bgColor" value="#ffffff">
                                <span>Background</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label for="size">Size: <span id="sizeLabel">300</span>px</label>
                    <input type="range" id="size" min="150" max="500" value="300">
                </div>

                <div class="control-group">
                    <label for="errorCorrection">Error Correction</label>
                    <select id="errorCorrection" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: light-dark(#0f0f0f, #fff);">
                        <option value="L">Low (7%)</option>
                        <option value="M" selected>Medium (15%)</option>
                        <option value="Q">Quartile (25%)</option>
                        <option value="H">High (30%)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Logo Overlay</label>
                    <div class="logo-upload" id="logoUpload">
                        <div>Click or drag to upload logo</div>
                        <input type="file" id="logoInput" accept="image/*">
                        <img id="logoPreview" class="logo-preview" style="display: none;">
                    </div>
                    <button class="secondary" id="removeLogo" style="margin-top: 10px; display: none;">Remove Logo</button>
                </div>
            </div>

            <div id="scanTab" class="tab-content">
                <h2>Scan QR Code</h2>
                <p style="color: light-dark(#616161, #666); margin-bottom: 20px; font-size: 13px;">Use your camera to scan QR codes or upload an image.</p>

                <div id="videoContainer">
                    <video id="scanVideo" autoplay playsinline></video>
                    <div class="scan-overlay"></div>
                </div>

                <div class="actions" style="margin-top: 20px;">
                    <button id="startScan">Start Camera</button>
                    <button id="stopScan" class="secondary" style="display: none;">Stop Camera</button>
                    <label class="secondary" style="padding: 12px 24px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer;">
                        Upload Image
                        <input type="file" id="scanImageInput" accept="image/*" style="display: none;">
                    </label>
                </div>

                <div id="scanResult"></div>
            </div>
        </div>

        <div class="panel">
            <h2>Preview</h2>
            <div class="preview-area">
                <canvas id="qrCanvas" width="300" height="300"></canvas>
                <div class="actions">
                    <button id="downloadPng">Download PNG</button>
                    <button id="downloadSvg" class="secondary">Download SVG</button>
                    <button id="copyToClipboard" class="secondary">Copy</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // The library's default encoder keeps only the low byte of each char code
        qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

        // QR Code Generator - wrapper around qrcode-generator library
        class QRCode {
            constructor(data, errorLevel = 'M') {
                this.data = data;
                this.errorLevel = errorLevel;
                this.modules = [];
                this.moduleCount = 0;
                this.generate();
            }

            generate() {
                const ecMap = { L: 'L', M: 'M', Q: 'Q', H: 'H' };
                const qr = qrcode(0, ecMap[this.errorLevel] || 'M');
                qr.addData(this.data);
                qr.make();

                this.moduleCount = qr.getModuleCount();
                this.modules = [];
                for (let row = 0; row < this.moduleCount; row++) {
                    this.modules[row] = [];
                    for (let col = 0; col < this.moduleCount; col++) {
                        this.modules[row][col] = qr.isDark(row, col);
                    }
                }
            }
        }

        // Main app logic
        const canvas = document.getElementById('qrCanvas');
        const ctx = canvas.getContext('2d');
        let currentQR = null;
        let logoImage = null;
        let currentPreset = 'classic';
        let currentType = 'text';

        const presetColors = {
            classic: { fg: '#000000', bg: '#ffffff' },
            ocean: { fg: '#4a00e0', bg: '#e0e7ff' },
            sunset: { fg: '#9c1f5a', bg: '#ffe4e1' },
            forest: { fg: '#0d5c4e', bg: '#e0fff4' },
            midnight: { fg: '#1a1a2e', bg: '#f0f0f0' },
            gold: { fg: '#8b5a00', bg: '#fffef0' },
            neon: { fg: '#9d00ff', bg: '#0a0a0a' },
            custom: { fg: '#000000', bg: '#ffffff' }
        };

        // The WIFI: format reserves \ ; , : " and escapes them with a backslash
        function escapeWifi(value) {
            return value.replace(/([\\;,:"])/g, '\\$1');
        }

        // Returns '' when there is nothing to encode
        function getContent() {
            if (currentType === 'text') {
                return document.getElementById('content').value;
            } else if (currentType === 'wifi') {
                const ssid = document.getElementById('wifiSsid').value;
                const password = document.getElementById('wifiPassword').value;
                const security = document.getElementById('wifiSecurity').value;
                if (!ssid) return '';
                return `WIFI:T:${security};S:${escapeWifi(ssid)};P:${escapeWifi(password)};;`;
            } else if (currentType === 'vcard') {
                const name = document.getElementById('vcardName').value;
                const phone = document.getElementById('vcardPhone').value;
                const email = document.getElementById('vcardEmail').value;
                if (!name && !phone && !email) return '';
                return `BEGIN:VCARD\nVERSION:3.0\nN:${name}\nFN:${name}\nTEL:${phone}\nEMAIL:${email}\nEND:VCARD`;
            }
            return '';
        }

        // Without a valid code the canvas only holds a message, so exporting is disabled
        function showNoQR(message, color) {
            const size = canvas.width;
            currentQR = null;
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = color;
            ctx.font = '14px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText(message, size / 2, size / 2);
            setExportEnabled(false);
        }

        function setExportEnabled(enabled) {
            ['downloadPng', 'downloadSvg', 'copyToClipboard'].forEach(id => {
                document.getElementById(id).disabled = !enabled;
            });
        }

        function generateQR() {
            const content = getContent();
            const size = parseInt(document.getElementById('size').value);
            const errorLevel = document.getElementById('errorCorrection').value;

            canvas.width = size;
            canvas.height = size;

            if (!content || content.trim() === '') {
                showNoQR('Enter content to generate a QR code', '#888');
                return;
            }

            try {
                currentQR = new QRCode(content, errorLevel);
            } catch (e) {
                showNoQR('Content too long or invalid', '#ff6b6b');
                return;
            }
            setExportEnabled(true);

            const colors = currentPreset === 'custom' ? {
                fg: document.getElementById('fgColor').value,
                bg: document.getElementById('bgColor').value
            } : presetColors[currentPreset];

            drawQR(currentQR, colors, size);
        }

        function drawQR(qr, colors, size) {
            // Quiet zone of 4 modules on every side, as the QR spec requires
            const actualModuleSize = size / (qr.moduleCount + 8);
            const margin = actualModuleSize * 4;

            // Background
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, size, size);

            // QR modules
            ctx.fillStyle = colors.fg;
            for (let row = 0; row < qr.moduleCount; row++) {
                for (let col = 0; col < qr.moduleCount; col++) {
                    if (qr.modules[row][col]) {
                        ctx.fillRect(
                            margin + col * actualModuleSize,
                            margin + row * actualModuleSize,
                            actualModuleSize + 0.5,
                            actualModuleSize + 0.5
                        );
                    }
                }
            }

            // Logo overlay
            if (logoImage) {
                const logoSize = size * 0.2;
                const logoX = (size - logoSize) / 2;
                const logoY = (size - logoSize) / 2;

                // White background for logo
                ctx.fillStyle = colors.bg;
                ctx.fillRect(logoX - 5, logoY - 5, logoSize + 10, logoSize + 10);

                ctx.drawImage(logoImage, logoX, logoY, logoSize, logoSize);
            }
        }

        // Event listeners
        document.querySelectorAll('.tabs .tab[data-tab]').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tabs .tab[data-tab]').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
                if (tab.dataset.tab !== 'scan' && videoStream) stopScan.click();
            });
        });

        document.querySelectorAll('.tabs .tab[data-type]').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tabs .tab[data-type]').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentType = tab.dataset.type;

                document.getElementById('textInput').style.display = currentType === 'text' ? 'block' : 'none';
                document.getElementById('wifiInput').style.display = currentType === 'wifi' ? 'block' : 'none';
                document.getElementById('vcardInput').style.display = currentType === 'vcard' ? 'block' : 'none';

                generateQR();
            });
        });

        document.querySelectorAll('.preset').forEach(preset => {
            preset.addEventListener('click', () => {
                document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
                preset.classList.add('active');
                currentPreset = preset.dataset.preset;
                document.getElementById('customColors').style.display = currentPreset === 'custom' ? 'block' : 'none';
                generateQR();
            });
        });

        document.getElementById('content').addEventListener('input', generateQR);
        document.getElementById('wifiSsid').addEventListener('input', generateQR);
        document.getElementById('wifiPassword').addEventListener('input', generateQR);
        document.getElementById('wifiSecurity').addEventListener('change', generateQR);
        document.getElementById('vcardName').addEventListener('input', generateQR);
        document.getElementById('vcardPhone').addEventListener('input', generateQR);
        document.getElementById('vcardEmail').addEventListener('input', generateQR);
        document.getElementById('size').addEventListener('input', e => {
            document.getElementById('sizeLabel').textContent = e.target.value;
            generateQR();
        });
        document.getElementById('errorCorrection').addEventListener('change', generateQR);
        document.getElementById('fgColor').addEventListener('input', generateQR);
        document.getElementById('bgColor').addEventListener('input', generateQR);

        // Logo upload
        const logoUpload = document.getElementById('logoUpload');
        const logoInput = document.getElementById('logoInput');
        const logoPreview = document.getElementById('logoPreview');
        const removeLogo = document.getElementById('removeLogo');

        logoUpload.addEventListener('click', () => logoInput.click());
        logoUpload.addEventListener('dragover', e => { e.preventDefault(); logoUpload.style.borderColor = 'rgba(100, 150, 255, 0.5)'; });
        logoUpload.addEventListener('dragleave', () => { logoUpload.style.borderColor = 'rgba(255,255,255,0.1)'; });
        logoUpload.addEventListener('drop', e => {
            e.preventDefault();
            logoUpload.style.borderColor = 'rgba(255,255,255,0.1)';
            if (e.dataTransfer.files[0]) handleLogoFile(e.dataTransfer.files[0]);
        });

        logoInput.addEventListener('change', e => {
            if (e.target.files[0]) handleLogoFile(e.target.files[0]);
            logoInput.value = ''; // so the same file can be chosen again
        });

        // The logo patch hides centre modules; only High correction reliably absorbs that
        function setLogoErrorCorrection(hasLogo) {
            const select = document.getElementById('errorCorrection');
            if (hasLogo) select.value = 'H';
            select.disabled = hasLogo;
            select.title = hasLogo ? 'A logo needs High error correction' : '';
        }

        function handleLogoFile(file) {
            const hint = logoUpload.querySelector('div');
            const reader = new FileReader();
            reader.onload = e => {
                // Only replace the current logo once the new one has decoded
                const img = new Image();
                img.onload = () => {
                    logoImage = img;
                    setLogoErrorCorrection(true);
                    hint.textContent = 'Click or drag to upload logo';
                    logoPreview.src = e.target.result;
                    logoPreview.style.display = 'block';
                    removeLogo.style.display = 'block';
                    generateQR();
                };
                img.onerror = () => {
                    hint.textContent = 'Could not read that image. Try another file.';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        removeLogo.addEventListener('click', () => {
            logoImage = null;
            setLogoErrorCorrection(false);
            logoPreview.style.display = 'none';
            removeLogo.style.display = 'none';
            logoInput.value = '';
            generateQR();
        });

        // Download buttons
        document.getElementById('downloadPng').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        document.getElementById('downloadSvg').addEventListener('click', () => {
            if (!currentQR) return;
            const size = parseInt(document.getElementById('size').value);
            const colors = currentPreset === 'custom' ? {
                fg: document.getElementById('fgColor').value,
                bg: document.getElementById('bgColor').value
            } : presetColors[currentPreset];

            const actualModuleSize = size / (currentQR.moduleCount + 8);
            const margin = actualModuleSize * 4;

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${size}" height="${size}">`;
            svg += `<rect width="${size}" height="${size}" fill="${colors.bg}"/>`;

            for (let row = 0; row < currentQR.moduleCount; row++) {
                for (let col = 0; col < currentQR.moduleCount; col++) {
                    if (currentQR.modules[row][col]) {
                        svg += `<rect x="${margin + col * actualModuleSize}" y="${margin + row * actualModuleSize}" width="${actualModuleSize + 0.5}" height="${actualModuleSize + 0.5}" fill="${colors.fg}"/>`;
                    }
                }
            }
            if (logoImage) {
                const logoSize = size * 0.2;
                const logoX = (size - logoSize) / 2;
                const logoY = (size - logoSize) / 2;
                svg += `<rect x="${logoX - 5}" y="${logoY - 5}" width="${logoSize + 10}" height="${logoSize + 10}" fill="${colors.bg}"/>`;
                svg += `<image x="${logoX}" y="${logoY}" width="${logoSize}" height="${logoSize}" preserveAspectRatio="none" xlink:href="${logoImage.src}"/>`;
            }
            svg += '</svg>';

            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const link = document.createElement('a');
            link.download = 'qrcode.svg';
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        document.getElementById('copyToClipboard').addEventListener('click', async () => {
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve));
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                const btn = document.getElementById('copyToClipboard');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 2000);
            } catch (err) {
                alert('Failed to copy. Try downloading instead.');
            }
        });

        // Scanner functionality
        let videoStream = null;
        const video = document.getElementById('scanVideo');
        const videoContainer = document.getElementById('videoContainer');
        const startScan = document.getElementById('startScan');
        const stopScan = document.getElementById('stopScan');
        const scanResult = document.getElementById('scanResult');

        startScan.addEventListener('click', async () => {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = videoStream;
                videoContainer.style.display = 'block';
                startScan.style.display = 'none';
                stopScan.style.display = 'inline-block';
                scanResult.style.display = 'none';
                requestAnimationFrame(scanFrame);
            } catch (err) {
                scanResult.textContent = 'Camera access denied or not available.';
                scanResult.className = 'error';
                scanResult.style.display = 'block';
            }
        });

        stopScan.addEventListener('click', () => {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            videoContainer.style.display = 'none';
            startScan.style.display = 'inline-block';
            stopScan.style.display = 'none';
        });

        function scanFrame() {
            if (!videoStream) return;
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(scanFrame);
                return;
            }
            const offscreen = document.createElement('canvas');
            offscreen.width = video.videoWidth;
            offscreen.height = video.videoHeight;
            const offCtx = offscreen.getContext('2d');
            offCtx.drawImage(video, 0, 0);
            const imageData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code) {
                scanResult.textContent = code.data;
                scanResult.className = '';
                scanResult.style.display = 'block';
                stopScan.click();
                return;
            }
            requestAnimationFrame(scanFrame);
        }

        document.getElementById('scanImageInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            e.target.value = ''; // so the same file can be chosen again

            const img = new Image();
            const objectUrl = URL.createObjectURL(file);
            img.onload = () => {
                const offscreen = document.createElement('canvas');
                offscreen.width = img.width;
                offscreen.height = img.height;
                const offCtx = offscreen.getContext('2d');
                offCtx.drawImage(img, 0, 0);
                const imageData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    scanResult.textContent = code.data;
                    scanResult.className = '';
                } else {
                    scanResult.textContent = 'No QR code found in image.';
                    scanResult.className = 'error';
                }
                scanResult.style.display = 'block';
                URL.revokeObjectURL(objectUrl);
            };
            img.onerror = () => {
                scanResult.textContent = 'Could not read that image.';
                scanResult.className = 'error';
                scanResult.style.display = 'block';
                URL.revokeObjectURL(objectUrl);
            };
            img.src = objectUrl;
        });

        // Initialize
        generateQR();
    </script>
</body>
</html>
