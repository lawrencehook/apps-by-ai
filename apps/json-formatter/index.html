<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter - AI Showcase</title><script src="../../site-theme.js"></script>
    <link rel="icon" href="../../favicons/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: light-dark(#efeff3, #0a0a0f);
            min-height: 100vh;
            color: light-dark(#2c2c2c, #e0e0e0);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: light-dark(#0f0f0f, #fff); }
        .subtitle { color: light-dark(#616161, #666); margin-bottom: 32px; }
        .back-link {
            position: fixed; top: 20px; right: 20px; color: light-dark(#616161, #666); text-decoration: none;
            font-size: 14px; padding: 8px 14px; background: light-dark(#fcfcfcd9, rgba(0,0,0,0.85));
            border-radius: 6px; border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1)); z-index: 100;
        }
        .back-link:hover { color: light-dark(#0f0f0f, #fff); }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            padding: 12px;
            background: light-dark(#0f0f0f08, rgba(255,255,255,0.03));
            border: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            border-radius: 8px;
        }
        .toolbar-btn {
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
            color: light-dark(#616161, #888);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .toolbar-btn:hover { background: light-dark(#0f0f0f1a, rgba(255,255,255,0.1)); color: light-dark(#0f0f0f, #fff); }
        .toolbar-btn.primary {
            background: light-dark(#44aea633, rgba(78, 205, 196, 0.2));
            border-color: light-dark(#44aea666, rgba(78, 205, 196, 0.4));
            color: light-dark(#378b85, #4ecdc4);
        }
        .toolbar-btn.primary:hover { background: light-dark(#44aea64c, rgba(78, 205, 196, 0.3)); }
        .indent-select {
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
            color: light-dark(#616161, #888);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .spacer { flex: 1; }
        .status-badge {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status-badge.valid { background: light-dark(#44aea633, rgba(78, 205, 196, 0.2)); color: light-dark(#378b85, #4ecdc4); }
        .status-badge.invalid { background: light-dark(#96131333, rgba(255, 107, 107, 0.2)); color: light-dark(#961313, #ff6b6b); }
        .status-badge.empty { background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05)); color: light-dark(#616161, #666); }
        .editors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 900px) {
            .editors { grid-template-columns: 1fr; }
        }
        .editor-panel {
            background: light-dark(#0f0f0f08, rgba(255,255,255,0.03));
            border: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .editor-panel.error { border-color: light-dark(#96131380, rgba(255, 107, 107, 0.5)); }
        .editor-header {
            padding: 10px 16px;
            background: light-dark(#fcfcfc4c, rgba(0,0,0,0.3));
            border-bottom: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .editor-title { color: light-dark(#616161, #888); font-size: 0.85rem; }
        .copy-btn {
            background: light-dark(#44aea633, rgba(78, 205, 196, 0.2));
            border: 1px solid light-dark(#44aea666, rgba(78, 205, 196, 0.4));
            color: light-dark(#378b85, #4ecdc4);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .copy-btn:hover { background: light-dark(#44aea64c, rgba(78, 205, 196, 0.3)); }
        textarea {
            flex: 1;
            min-height: 500px;
            background: transparent;
            border: none;
            color: light-dark(#2c2c2c, #e0e0e0);
            padding: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        }
        textarea:focus { outline: none; }
        textarea::placeholder { color: light-dark(#bdbdbd, #444); }
        .error-message {
            padding: 12px 16px;
            background: light-dark(#9613131a, rgba(255, 107, 107, 0.1));
            border-top: 1px solid light-dark(#96131333, rgba(255, 107, 107, 0.2));
            color: light-dark(#961313, #ff6b6b);
            font-size: 0.85rem;
            font-family: monospace;
        }
        .json-string { color: light-dark(#5c7e44, #98c379); }
        .json-number { color: light-dark(#8a6038, #d19a66); }
        .json-boolean { color: light-dark(#3d7d84, #56b6c2); }
        .json-null { color: light-dark(#76328a, #c678dd); }
        .json-key { color: light-dark(#923037, #e06c75); }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-link">← Back</a>
    <div class="container">
        <h1>JSON Formatter</h1>
        <p class="subtitle">Format, validate, and minify JSON data.</p>

        <div class="toolbar">
            <button class="toolbar-btn primary" id="formatBtn">Format</button>
            <button class="toolbar-btn" id="minifyBtn">Minify</button>
            <select class="indent-select" id="indentSelect" aria-label="Indentation">
                <option value="2">2 spaces</option>
                <option value="4">4 spaces</option>
                <option value="tab">Tab</option>
            </select>
            <button class="toolbar-btn" id="clearBtn">Clear</button>
            <button class="toolbar-btn" id="sampleBtn">Load Sample</button>
            <span class="spacer"></span>
            <span class="status-badge empty" id="statusBadge">Empty</span>
        </div>

        <div class="editors">
            <div class="editor-panel" id="inputPanel">
                <div class="editor-header">
                    <span class="editor-title">Input JSON</span>
                </div>
                <textarea id="inputText" placeholder='Paste your JSON here...

Example:
{"name":"John","age":30,"city":"New York"}'></textarea>
                <div class="error-message" id="errorMessage" style="display: none;"></div>
            </div>
            <div class="editor-panel">
                <div class="editor-header">
                    <span class="editor-title">Formatted Output</span>
                    <button class="copy-btn" id="copyBtn">Copy</button>
                </div>
                <textarea id="outputText" readonly placeholder="Formatted JSON will appear here..."></textarea>
            </div>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const statusBadge = document.getElementById('statusBadge');
        const errorMessage = document.getElementById('errorMessage');
        const inputPanel = document.getElementById('inputPanel');

        function getIndent() {
            const val = document.getElementById('indentSelect').value;
            return val === 'tab' ? '\t' : parseInt(val);
        }

        // Re-indent the source text token by token (it has already passed JSON.parse).
        // JSON.stringify(JSON.parse(text)) would silently rewrite big integers and 1.0
        // and drop duplicate keys. An indent of '' minifies.
        function reformat(text, indent) {
            const pad = typeof indent === 'number' ? ' '.repeat(indent) : indent;
            const pretty = pad !== '';
            let out = '';
            let depth = 0;
            const newline = () => (pretty ? '\n' + pad.repeat(depth) : '');

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === '"') {
                    let j = i + 1;
                    while (text[j] !== '"') j += text[j] === '\\' ? 2 : 1;
                    out += text.slice(i, j + 1);
                    i = j;
                } else if (ch === '{' || ch === '[') {
                    let j = i + 1;
                    while (/\s/.test(text[j])) j++;
                    if (text[j] === '}' || text[j] === ']') {
                        out += ch + text[j]; // empty containers stay on one line
                        i = j;
                    } else {
                        depth++;
                        out += ch + newline();
                    }
                } else if (ch === '}' || ch === ']') {
                    depth--;
                    out += newline() + ch;
                } else if (ch === ',') {
                    out += ',' + newline();
                } else if (ch === ':') {
                    out += pretty ? ': ' : ':';
                } else if (!/\s/.test(ch)) {
                    out += ch;
                }
            }
            return out;
        }

        function validate() {
            const text = inputText.value.trim();

            if (!text) {
                statusBadge.className = 'status-badge empty';
                statusBadge.textContent = 'Empty';
                errorMessage.style.display = 'none';
                inputPanel.classList.remove('error');
                outputText.value = '';
                return { success: false, text: '' };
            }

            try {
                JSON.parse(text);
                statusBadge.className = 'status-badge valid';
                statusBadge.textContent = 'Valid JSON';
                errorMessage.style.display = 'none';
                inputPanel.classList.remove('error');
                return { success: true, text };
            } catch (e) {
                statusBadge.className = 'status-badge invalid';
                statusBadge.textContent = 'Invalid JSON';
                errorMessage.textContent = e.message;
                errorMessage.style.display = 'block';
                inputPanel.classList.add('error');
                outputText.value = '';
                return { success: false, text: '' };
            }
        }

        function format() {
            const { success, text } = validate();
            if (success) {
                outputText.value = reformat(text, getIndent());
            }
        }

        function minify() {
            const { success, text } = validate();
            if (success) {
                outputText.value = reformat(text, '');
            }
        }

        inputText.addEventListener('input', () => {
            format();
        });

        document.getElementById('formatBtn').addEventListener('click', format);
        document.getElementById('minifyBtn').addEventListener('click', minify);
        document.getElementById('indentSelect').addEventListener('change', format);

        document.getElementById('clearBtn').addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
            validate();
        });

        document.getElementById('sampleBtn').addEventListener('click', () => {
            inputText.value = JSON.stringify({
                "name": "John Doe",
                "age": 30,
                "email": "john@example.com",
                "isActive": true,
                "balance": null,
                "address": {
                    "street": "123 Main St",
                    "city": "New York",
                    "zipCode": "10001"
                },
                "hobbies": ["reading", "gaming", "hiking"],
                "orders": [
                    { "id": 1, "product": "Laptop", "price": 999.99 },
                    { "id": 2, "product": "Phone", "price": 699.99 }
                ]
            });
            format();
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            if (!outputText.value) return;
            const btn = document.getElementById('copyBtn');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(outputText.value).then(() => {
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = 'Copy', 1500);
                }).catch(() => {
                    fallbackCopy();
                });
            } else {
                fallbackCopy();
            }
            function fallbackCopy() {
                outputText.select();
                document.execCommand('copy');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 1500);
            }
        });
    </script>
</body>
</html>
