<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langton's Ant - AI Showcase</title><script src="../../site-theme.js"></script>
    <link rel="icon" href="../../favicons/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: light-dark(#efeff3, #0a0a0f); overflow: hidden; font-family: system-ui, sans-serif; }
        canvas { display: block; }
        .controls {
            position: fixed; top: 20px; left: 20px; background: light-dark(#fcfcfcd9, rgba(0,0,0,0.85));
            padding: 20px; border-radius: 8px; color: light-dark(#0f0f0f, #fff); font-size: 14px;
            min-width: 220px; border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
            z-index: 100; max-height: calc(100vh - 40px); overflow-y: auto;
        }
        .controls h1 { font-size: 1.3rem; margin-bottom: 8px; }
        .controls p { color: light-dark(#616161, #666); margin-bottom: 16px; line-height: 1.4; font-size: 13px; }
        button {
            background: light-dark(#0f0f0f1a, rgba(255,255,255,0.1)); border: 1px solid light-dark(#0f0f0f33, rgba(255,255,255,0.2));
            color: light-dark(#0f0f0f, #fff); padding: 8px 14px; border-radius: 4px; cursor: pointer;
            font-size: 13px; margin-right: 6px; margin-bottom: 6px;
        }
        button:hover { background: light-dark(#0f0f0f33, rgba(255,255,255,0.2)); }
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; margin-bottom: 4px; color: light-dark(#616161, #888); font-size: 12px; }
        .control-group input[type="range"] { width: 100%; }
        .back-link {
            position: fixed; top: 20px; right: 20px; color: light-dark(#616161, #666); text-decoration: none;
            font-size: 14px; padding: 8px 14px; background: light-dark(#fcfcfcd9, rgba(0,0,0,0.85));
            border-radius: 6px; border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
        }
        .back-link:hover { color: light-dark(#0f0f0f, #fff); }
        .status { color: light-dark(#616161, #666); font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <h1>Langton's Ant</h1>
        <p>Simple rules create complex emergent behavior. After ~10,000 steps, a "highway" pattern emerges.</p>
        <div class="control-group">
            <label for="speed">Speed: <span id="speedLabel">100</span> steps/frame</label>
            <input type="range" id="speed" min="1" max="500" value="100">
        </div>
        <div class="control-group">
            <label for="ants">Ants: <span id="antsLabel">1</span></label>
            <input type="range" id="ants" min="1" max="10" value="1">
        </div>
        <button id="reset">Reset</button>
        <button id="pause">Pause</button>
        <div class="status" id="status">Steps: 0</div>
    </div>
    <a href="../../index.html" class="back-link">← Back</a>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, cols, rows;
        let grid = [];
        let ants = [];
        let steps = 0;
        let speed = 100;
        let numAnts = 1;
        let paused = false;
        const CELL_SIZE = 4;

        // Directions: 0=up, 1=right, 2=down, 3=left
        const dx = [0, 1, 0, -1];
        const dy = [-1, 0, 1, 0];

        const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#f38181',
                        '#aa96da', '#fcbad3', '#a8d8ea', '#ffaaa5', '#ffd3b6'];

        class Ant {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.dir = 0; // facing up
                this.color = color;
            }

            step() {
                // Get current cell state
                const idx = this.y * cols + this.x;
                const isBlack = grid[idx] === 0;

                // Turn based on current cell
                if (isBlack) {
                    this.dir = (this.dir + 1) % 4; // Turn right
                } else {
                    this.dir = (this.dir + 3) % 4; // Turn left
                }

                // Flip cell color
                grid[idx] = 1 - grid[idx];

                // Move forward
                this.x = (this.x + dx[this.dir] + cols) % cols;
                this.y = (this.y + dy[this.dir] + rows) % rows;
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            const oldCols = cols, oldRows = rows, oldGrid = grid;
            cols = Math.floor(width / CELL_SIZE);
            rows = Math.floor(height / CELL_SIZE);
            if (!oldCols || !oldRows || !cols || !rows) {
                init();
                return;
            }

            // Keep the existing pattern, centred, instead of restarting
            const shiftX = Math.floor(cols / 2) - Math.floor(oldCols / 2);
            const shiftY = Math.floor(rows / 2) - Math.floor(oldRows / 2);
            grid = new Uint8Array(cols * rows);
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#fff';
            for (let oy = 0; oy < oldRows; oy++) {
                const y = oy + shiftY;
                if (y < 0 || y >= rows) continue;
                for (let ox = 0; ox < oldCols; ox++) {
                    const x = ox + shiftX;
                    if (x < 0 || x >= cols || !oldGrid[oy * oldCols + ox]) continue;
                    grid[y * cols + x] = 1;
                    ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            }
            for (const ant of ants) {
                ant.x = (((ant.x + shiftX) % cols) + cols) % cols;
                ant.y = (((ant.y + shiftY) % rows) + rows) % rows;
                ctx.fillStyle = ant.color;
                ctx.fillRect(ant.x * CELL_SIZE, ant.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
        }

        function init() {
            grid = new Uint8Array(cols * rows);
            ants = [];
            steps = 0;

            for (let i = 0; i < numAnts; i++) {
                const offsetX = Math.floor((i - numAnts / 2) * 20);
                ants.push(new Ant(
                    (((Math.floor(cols / 2) + offsetX) % cols) + cols) % cols,
                    Math.floor(rows / 2),
                    colors[i % colors.length]
                ));
            }

            // Clear canvas
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);
        }

        let lastTime = performance.now();
        let stepDebt = 0;

        function render() {
            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (!paused) {
                // "steps/frame" is per 60fps frame; scale by real elapsed time
                stepDebt += speed * dt * 60;
                const n = Math.floor(stepDebt);
                stepDebt -= n;
                for (let s = 0; s < n; s++) {
                    for (const ant of ants) {
                        const prevX = ant.x;
                        const prevY = ant.y;

                        ant.step();

                        // Draw the cell the ant just left (after it was flipped by step)
                        const idx = prevY * cols + prevX;
                        const x = prevX * CELL_SIZE;
                        const y = prevY * CELL_SIZE;

                        if (grid[idx] === 0) {
                            ctx.fillStyle = '#0a0a0f';
                        } else {
                            ctx.fillStyle = '#fff';
                        }
                        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                    }
                    steps++;
                }

                // Draw ants
                for (const ant of ants) {
                    ctx.fillStyle = ant.color;
                    ctx.fillRect(ant.x * CELL_SIZE, ant.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }

                document.getElementById('status').textContent = `Steps: ${steps.toLocaleString()}`;
            }

            requestAnimationFrame(render);
        }

        document.getElementById('speed').addEventListener('input', e => {
            speed = parseInt(e.target.value);
            document.getElementById('speedLabel').textContent = speed;
        });

        document.getElementById('ants').addEventListener('input', e => {
            numAnts = parseInt(e.target.value);
            document.getElementById('antsLabel').textContent = numAnts;
            init();
        });

        document.getElementById('reset').addEventListener('click', init);

        document.getElementById('pause').addEventListener('click', e => {
            paused = !paused;
            e.target.textContent = paused ? 'Resume' : 'Pause';
        });

        window.addEventListener('resize', resize);
        resize();
        render();
    </script>
</body>
</html>
