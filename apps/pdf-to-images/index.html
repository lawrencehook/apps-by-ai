<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Images - AI Showcase</title><script src="../../site-theme.js"></script>
    <link rel="icon" href="../../favicons/favicon.ico">
    <script src="../../libs/pdfjs-3.11.174/pdf.min.js"></script>
    <script src="../../libs/jszip-3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: light-dark(#efeff3, #0a0a0f);
            min-height: 100vh;
            color: light-dark(#2c2c2c, #e0e0e0);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: light-dark(#0f0f0f, #fff); }
        .subtitle { color: light-dark(#616161, #666); margin-bottom: 32px; }
        .back-link {
            position: fixed; top: 20px; right: 20px; color: light-dark(#616161, #666); text-decoration: none;
            font-size: 14px; padding: 8px 14px; background: light-dark(#fcfcfcd9, rgba(0,0,0,0.85));
            border-radius: 6px; border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
        }
        .back-link:hover { color: light-dark(#0f0f0f, #fff); }
        .drop-zone {
            border: 2px dashed light-dark(#0f0f0f33, rgba(255,255,255,0.2));
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: light-dark(#44aea6, #4ecdc4);
            background: light-dark(#44aea60d, rgba(78, 205, 196, 0.05));
        }
        .drop-zone-text { color: light-dark(#616161, #888); font-size: 1.1rem; }
        .drop-zone-hint { color: light-dark(#616161, #555); font-size: 0.85rem; margin-top: 8px; }
        input[type="file"] { display: none; }
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            background: light-dark(#44aea633, rgba(78, 205, 196, 0.2));
            border: 1px solid light-dark(#44aea666, rgba(78, 205, 196, 0.4));
            color: light-dark(#378b85, #4ecdc4);
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button:hover { background: light-dark(#44aea64c, rgba(78, 205, 196, 0.3)); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary {
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border-color: light-dark(#0f0f0f33, rgba(255,255,255,0.2));
            color: light-dark(#616161, #888);
        }
        button.secondary:hover { background: light-dark(#0f0f0f1a, rgba(255,255,255,0.1)); color: light-dark(#0f0f0f, #fff); }
        button.primary {
            background: light-dark(#44aea64c, rgba(78, 205, 196, 0.3));
            padding: 12px 24px;
            font-size: 1rem;
        }
        .spacer { flex: 1; }
        .options {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .option-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .option-group label {
            color: light-dark(#616161, #888);
            font-size: 0.85rem;
        }
        select, input[type="number"] {
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border: 1px solid light-dark(#0f0f0f26, rgba(255,255,255,0.15));
            color: light-dark(#0f0f0f, #fff);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        input[type="number"] { width: 80px; }
        .page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .page-card {
            background: light-dark(#0f0f0f08, rgba(255,255,255,0.03));
            border-radius: 8px;
            border: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            overflow: hidden;
            position: relative;
        }
        .page-preview {
            aspect-ratio: 8.5/11;
            background: light-dark(#e0e0e4, #1a1a1f);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .page-preview canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .page-info {
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-number { font-size: 0.85rem; color: light-dark(#616161, #888); }
        .download-btn {
            background: light-dark(#44aea633, rgba(78, 205, 196, 0.2));
            border: 1px solid light-dark(#44aea64c, rgba(78, 205, 196, 0.3));
            color: light-dark(#378b85, #4ecdc4);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .download-btn:hover { background: light-dark(#44aea64c, rgba(78, 205, 196, 0.3)); }
        .status {
            margin-top: 24px;
            padding: 16px;
            background: light-dark(#44aea61a, rgba(78, 205, 196, 0.1));
            border-radius: 8px;
            color: light-dark(#378b85, #4ecdc4);
            display: none;
        }
        .status.error {
            background: light-dark(#9613131a, rgba(255, 107, 107, 0.1));
            color: light-dark(#961313, #ff6b6b);
        }
        .status.show { display: block; }
        .hidden { display: none !important; }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: light-dark(#44aea6, #4ecdc4);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-link">← Back</a>
    <div class="container">
        <h1>PDF to Images</h1>
        <p class="subtitle">Convert PDF pages to high-quality images.</p>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-text">Drop a PDF file here or click to browse</div>
            <div class="drop-zone-hint">Select a PDF to convert to images</div>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <div class="hidden" id="editorPanel">
            <div class="toolbar">
                <div class="options">
                    <div class="option-group">
                        <label for="formatSelect">Format:</label>
                        <select id="formatSelect">
                            <option value="png">PNG</option>
                            <option value="jpeg">JPEG</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="scaleSelect">Scale:</label>
                        <select id="scaleSelect">
                            <option value="1">1x (72 DPI)</option>
                            <option value="2" selected>2x (144 DPI)</option>
                            <option value="3">3x (216 DPI)</option>
                            <option value="4">4x (288 DPI)</option>
                        </select>
                    </div>
                    <div class="option-group" id="qualityGroup" style="display: none;">
                        <label for="qualityInput">Quality:</label>
                        <input type="number" id="qualityInput" value="90" min="1" max="100">
                    </div>
                </div>
                <span class="spacer"></span>
                <button id="downloadAllBtn" class="primary">Download All</button>
            </div>

            <div class="page-grid" id="pageGrid"></div>

            <div class="toolbar">
                <button id="resetBtn" class="secondary">Choose Different File</button>
            </div>
        </div>

        <div class="status" id="status">
            <span id="statusText"></span>
            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = '../../libs/pdfjs-3.11.174/pdf.worker.min.js';

        let currentFile = null;
        let pdfDoc = null;
        let loadId = 0; // bumped when the file is replaced; async work checks it after every await

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const editorPanel = document.getElementById('editorPanel');
        const pageGrid = document.getElementById('pageGrid');
        const status = document.getElementById('status');
        const formatSelect = document.getElementById('formatSelect');
        const qualityGroup = document.getElementById('qualityGroup');

        // Show/hide quality option based on format
        formatSelect.addEventListener('change', () => {
            qualityGroup.style.display = formatSelect.value === 'jpeg' ? 'flex' : 'none';
        });

        // Drop zone events
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file) {
            if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                showStatus('Please select a PDF file', true);
                return;
            }

            const id = ++loadId;
            showStatus('Loading PDF...');

            try {
                const arrayBuffer = await file.arrayBuffer();
                const doc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                if (id !== loadId) { doc.destroy(); return; }
                if (pdfDoc) pdfDoc.destroy();
                pdfDoc = doc;
                currentFile = { file, arrayBuffer };

                await renderPageGrid(id);
                if (id !== loadId) return;

                dropZone.classList.add('hidden');
                editorPanel.classList.remove('hidden');
                status.classList.remove('show');
            } catch (err) {
                if (id !== loadId) return;
                showStatus('Error loading PDF: ' + err.message, true);
            }
        }

        // Thumbnails are small and independent of the export scale; full-size pages are
        // rendered one at a time on download (50 pages kept at 4x would be about 1.5GB).
        const THUMBNAIL_WIDTH = 320;

        async function renderPageGrid(id) {
            const doc = pdfDoc;
            pageGrid.innerHTML = '';

            showStatus('Rendering pages...');
            showProgress(0);

            for (let i = 0; i < doc.numPages; i++) {
                const card = document.createElement('div');
                card.className = 'page-card';

                const preview = document.createElement('div');
                preview.className = 'page-preview';

                const canvas = document.createElement('canvas');
                preview.appendChild(canvas);

                const info = document.createElement('div');
                info.className = 'page-info';
                info.innerHTML = `
                    <span class="page-number">Page ${i + 1}</span>
                    <button class="download-btn" data-page="${i}">Download</button>
                `;
                info.querySelector('.download-btn').addEventListener('click', () => downloadPage(i));

                card.appendChild(preview);
                card.appendChild(info);
                pageGrid.appendChild(card);

                const page = await doc.getPage(i + 1);
                if (id !== loadId) return;
                const scale = Math.min(1, THUMBNAIL_WIDTH / page.getViewport({ scale: 1 }).width);
                const viewport = page.getViewport({ scale });

                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport }).promise;
                if (id !== loadId) return;

                showProgress((i + 1) / doc.numPages * 100);
            }

            hideProgress();
            status.classList.remove('show');
        }

        // Render one page at the chosen scale and encode it; the canvas is released afterwards
        async function renderPageBlob(doc, pageIndex, scale, format, quality) {
            const page = await doc.getPage(pageIndex + 1);
            const viewport = page.getViewport({ scale });

            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

            const blob = await new Promise(resolve => {
                if (format === 'jpeg') canvas.toBlob(resolve, 'image/jpeg', quality);
                else canvas.toBlob(resolve, 'image/png');
            });
            canvas.width = canvas.height = 0;
            if (!blob) throw new Error(`Page ${pageIndex + 1} is too large to render at ${scale}x`);
            return blob;
        }

        function exportOptions() {
            return {
                scale: parseFloat(document.getElementById('scaleSelect').value),
                format: formatSelect.value,
                quality: parseInt(document.getElementById('qualityInput').value) / 100
            };
        }

        function saveBlob(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function downloadPage(pageIndex) {
            const id = loadId;
            const { scale, format, quality } = exportOptions();
            const baseName = currentFile.file.name.replace(/\.pdf$/i, '');

            showStatus(`Rendering page ${pageIndex + 1}...`);
            try {
                const blob = await renderPageBlob(pdfDoc, pageIndex, scale, format, quality);
                if (id !== loadId) return;
                saveBlob(blob, `${baseName}_page_${pageIndex + 1}.${format}`);
                status.classList.remove('show');
            } catch (err) {
                if (id !== loadId) return;
                showStatus('Error rendering page: ' + err.message, true);
            }
        }

        document.getElementById('downloadAllBtn').addEventListener('click', async () => {
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            const id = loadId;
            const doc = pdfDoc;
            const { scale, format, quality } = exportOptions();
            const baseName = currentFile.file.name.replace(/\.pdf$/i, '');

            downloadAllBtn.disabled = true;
            showStatus('Rendering pages...');
            showProgress(0);

            try {
                // One zip instead of one download per page, which browsers block
                const zip = new JSZip();
                let single = null;

                for (let i = 0; i < doc.numPages; i++) {
                    const blob = await renderPageBlob(doc, i, scale, format, quality);
                    if (id !== loadId) return;
                    if (doc.numPages === 1) single = blob;
                    else zip.file(`${baseName}_page_${i + 1}.${format}`, blob);

                    showProgress((i + 1) / doc.numPages * 100);
                }

                if (single) {
                    saveBlob(single, `${baseName}_page_1.${format}`);
                } else {
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    if (id !== loadId) return;
                    saveBlob(zipBlob, `${baseName}_images.zip`);
                }

                hideProgress();
                showStatus(doc.numPages === 1
                    ? 'Downloaded 1 image'
                    : `Downloaded ${doc.numPages} images as ${baseName}_images.zip`);
            } catch (err) {
                if (id !== loadId) return;
                hideProgress();
                showStatus('Error rendering pages: ' + err.message, true);
            } finally {
                downloadAllBtn.disabled = false;
            }
        });

        function showStatus(message, isError = false) {
            document.getElementById('statusText').textContent = message;
            status.className = 'status show' + (isError ? ' error' : '');
        }

        function showProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            progressBar.style.display = 'block';
            progressFill.style.width = percent + '%';
        }

        function hideProgress() {
            document.getElementById('progressBar').style.display = 'none';
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            loadId++;
            currentFile = null;
            if (pdfDoc) pdfDoc.destroy();
            pdfDoc = null;
            hideProgress();
            fileInput.value = '';
            dropZone.classList.remove('hidden');
            editorPanel.classList.add('hidden');
            status.classList.remove('show');
        });
    </script>
</body>
</html>
