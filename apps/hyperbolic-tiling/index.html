<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperbolic Tiling - Apps by AI</title><script src="../../site-theme.js"></script>
    <link rel="icon" href="../../favicons/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: system-ui, -apple-system, sans-serif;
            background: light-dark(#efeff3, #0a0a0f);
            height: 100vh;
            overflow: hidden;
            color: light-dark(#2c2c2c, #e0e0e0);
        }
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .title-section {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        h1 { font-size: 1.3rem; color: light-dark(#0f0f0f, #fff); }
        .subtitle { color: light-dark(#616161, #666); font-size: 0.8rem; }
        .back-link {
            color: light-dark(#616161, #666); text-decoration: none; font-size: 13px;
            padding: 6px 12px; background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border-radius: 6px; border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
        }
        .back-link:hover { color: light-dark(#0f0f0f, #fff); }
        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 10px 14px;
            background: light-dark(#0f0f0f08, rgba(255,255,255,0.03));
            border: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            border-radius: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label { color: light-dark(#616161, #888); font-size: 0.75rem; }
        select, button {
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border: 1px solid light-dark(#0f0f0f26, rgba(255,255,255,0.15));
            color: light-dark(#0f0f0f, #fff); padding: 5px 12px; border-radius: 4px; font-size: 0.8rem;
            cursor: pointer;
        }
        button:hover { background: light-dark(#0f0f0f1a, rgba(255,255,255,0.1)); }
        input[type="range"] { width: 80px; accent-color: light-dark(#44aea6, #4ecdc4); }
        .value { color: light-dark(#378b85, #4ecdc4); font-family: monospace; font-size: 0.8rem; min-width: 25px; }
        .btn-primary {
            background: light-dark(#44aea626, rgba(78, 205, 196, 0.15));
            border-color: light-dark(#44aea64c, rgba(78, 205, 196, 0.3));
            color: light-dark(#378b85, #4ecdc4);
        }
        input[type="checkbox"] { accent-color: light-dark(#44aea6, #4ecdc4); }
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 50%;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: light-dark(#fcfcfccc, rgba(0,0,0,0.8));
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: light-dark(#616161, #888);
        }
        .info span { color: light-dark(#378b85, #4ecdc4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-section">
                <h1>Hyperbolic Tiling</h1>
                <span class="subtitle">Poincaré disk model tessellations</span>
            </div>
            <a href="../../index.html" class="back-link">← Back</a>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="tiling">Tiling {p,q}</label>
                <select id="tiling">
                    <option value="5,4">{5,4} Pentagons</option>
                    <option value="4,5">{4,5} Squares</option>
                    <option value="3,7">{3,7} Triangles</option>
                    <option value="7,3">{7,3} Heptagons</option>
                    <option value="6,4">{6,4} Hexagons</option>
                    <option value="4,6">{4,6} Squares</option>
                    <option value="8,3">{8,3} Octagons</option>
                </select>
            </div>
            <div class="control-group">
                <label for="depth">Depth</label>
                <input type="range" id="depth" min="3" max="8" value="5">
                <span class="value" id="depthVal">5</span>
            </div>
            <div class="control-group">
                <label for="colorScheme">Color</label>
                <select id="colorScheme">
                    <option value="alternating">Alternating</option>
                    <option value="rainbow">Rainbow</option>
                    <option value="depth">By Depth</option>
                    <option value="mono">Monochrome</option>
                </select>
            </div>
            <div class="control-group">
                <label><input type="checkbox" id="showEdges" checked> Edges</label>
            </div>
            <button class="btn-primary" id="regenerate">Regenerate</button>
        </div>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tilingSelect = document.getElementById('tiling');
        const depthSlider = document.getElementById('depth');
        const colorSelect = document.getElementById('colorScheme');
        const showEdgesCheck = document.getElementById('showEdges');

        let width, height, cx, cy, radius;
        let polygons = [];

        function resize() {
            const container = document.querySelector('.canvas-container');
            const size = Math.min(container.clientWidth, container.clientHeight) - 20;
            width = height = Math.floor(size);
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2;
            radius = (size / 2) - 5;
            generate();
        }

        function complexAbs(a) {
            return Math.sqrt(a.re * a.re + a.im * a.im);
        }

        // Geodesic through a and b: the circle orthogonal to the unit circle
        // (centre c with c.a = (1 + |a|^2) / 2, radius^2 = |c|^2 - 1).
        // Returns null when a, b and the origin are collinear (the geodesic is a diameter).
        function geodesic(a, b) {
            const det = a.re * b.im - a.im * b.re;
            if (Math.abs(det) < 1e-12) return null;
            const ka = (1 + a.re * a.re + a.im * a.im) / 2;
            const kb = (1 + b.re * b.re + b.im * b.im) / 2;
            const re = (ka * b.im - kb * a.im) / det;
            const im = (a.re * kb - b.re * ka) / det;
            return { re, im, r2: re * re + im * im - 1 };
        }

        // Hyperbolic reflection in the geodesic through a and b: inversion in its circle
        function reflect(z, a, b, g) {
            if (!g) {
                const angle = Math.atan2(b.im - a.im, b.re - a.re);
                const cos2 = Math.cos(2 * angle);
                const sin2 = Math.sin(2 * angle);
                return { re: z.re * cos2 + z.im * sin2, im: z.re * sin2 - z.im * cos2 };
            }
            const dx = z.re - g.re;
            const dy = z.im - g.im;
            const k = g.r2 / (dx * dx + dy * dy);
            return { re: g.re + dx * k, im: g.im + dy * k };
        }

        function generate() {
            const [p, q] = tilingSelect.value.split(',').map(Number);
            const maxDepth = parseInt(depthSlider.value);
            document.getElementById('depthVal').textContent = maxDepth;

            // Calculate the distance from center to vertex of central polygon
            const angleP = Math.PI / p;
            const angleQ = Math.PI / q;

            // Using hyperbolic trigonometry
            const num = Math.cos(angleP) * Math.cos(angleQ);
            const denom = Math.sin(angleP) * Math.sin(angleQ);
            const coshR = num / denom;
            const r = Math.log(coshR + Math.sqrt(coshR * coshR - 1)); // arcosh
            const vertexDist = Math.tanh(r / 2);

            // Generate central polygon
            const centralVertices = [];
            for (let i = 0; i < p; i++) {
                const angle = (2 * Math.PI * i) / p - Math.PI / 2;
                centralVertices.push({
                    re: vertexDist * Math.cos(angle),
                    im: vertexDist * Math.sin(angle)
                });
            }

            // Each polygon is identified by its centre (the image of the origin)
            const centerKey = c => `${Math.round(c.re * 1e5)},${Math.round(c.im * 1e5)}`;
            const origin = { re: 0, im: 0 };
            const visited = new Set([centerKey(origin)]);

            // Breadth-first, so depth is the number of edges crossed from the centre
            polygons = [{ vertices: centralVertices, center: origin, depth: 0, colorIdx: 0 }];

            for (let head = 0; head < polygons.length; head++) {
                const { vertices, center, depth, colorIdx } = polygons[head];
                if (depth >= maxDepth) continue;

                for (let i = 0; i < p; i++) {
                    const v1 = vertices[i];
                    const v2 = vertices[(i + 1) % p];
                    const g = geodesic(v1, v2);

                    const newCenter = reflect(center, v1, v2, g);
                    // Tiles this close to the rim are smaller than a pixel
                    if (complexAbs(newCenter) > 0.998) continue;

                    const key = centerKey(newCenter);
                    if (visited.has(key)) continue;
                    visited.add(key);

                    polygons.push({
                        vertices: vertices.map(v => reflect(v, v1, v2, g)),
                        center: newCenter,
                        depth: depth + 1,
                        colorIdx: (colorIdx + 1) % 2
                    });
                }
            }

            draw();
        }

        function getColor(polygon, scheme, maxDepth) {
            const { depth, colorIdx } = polygon;
            const t = depth / maxDepth;

            switch (scheme) {
                case 'alternating':
                    return colorIdx === 0 ?
                        `hsl(175, 60%, ${Math.max(10, 45 - depth * 3)}%)` :
                        `hsl(350, 60%, ${Math.max(10, 45 - depth * 3)}%)`;
                case 'rainbow':
                    return `hsl(${(colorIdx * 180 + depth * 30) % 360}, 65%, ${Math.max(10, 50 - depth * 4)}%)`;
                case 'depth':
                    return `hsl(${200 + depth * 20}, 70%, ${Math.max(10, 55 - depth * 5)}%)`;
                case 'mono':
                    const l = Math.max(10, 50 - depth * 6);
                    return colorIdx === 0 ? `hsl(175, 60%, ${l}%)` : `hsl(175, 30%, ${Math.max(5, l - 10)}%)`;
            }
        }

        // Edge from a to b as an arc of its geodesic circle (always the minor arc).
        // Returns null when the arc is flat enough to draw as a straight line.
        function edgeArc(a, b) {
            const g = geodesic(a, b);
            if (!g || g.r2 > 1e8) return null;
            const start = Math.atan2(a.im - g.im, a.re - g.re);
            const end = Math.atan2(b.im - g.im, b.re - g.re);
            let delta = end - start;
            if (delta > Math.PI) delta -= 2 * Math.PI;
            if (delta < -Math.PI) delta += 2 * Math.PI;
            return { re: g.re, im: g.im, r: Math.sqrt(g.r2), start, end, anticlockwise: delta < 0 };
        }

        function draw() {
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);

            // Draw disk boundary
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            const scheme = colorSelect.value;
            const maxDepth = parseInt(depthSlider.value);
            const showEdges = showEdgesCheck.checked;

            // Sort by depth (draw deeper first)
            const sorted = [...polygons].sort((a, b) => b.depth - a.depth);

            sorted.forEach(polygon => {
                const { vertices } = polygon;

                ctx.beginPath();
                ctx.moveTo(cx + vertices[0].re * radius, cy + vertices[0].im * radius);
                vertices.forEach((v, i) => {
                    const next = vertices[(i + 1) % vertices.length];
                    const arc = edgeArc(v, next);
                    if (arc) {
                        ctx.arc(cx + arc.re * radius, cy + arc.im * radius, arc.r * radius, arc.start, arc.end, arc.anticlockwise);
                    } else {
                        ctx.lineTo(cx + next.re * radius, cy + next.im * radius);
                    }
                });
                ctx.closePath();

                ctx.fillStyle = getColor(polygon, scheme, maxDepth);
                ctx.fill();

                if (showEdges) {
                    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            });

            // Clip to disk
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            // Redraw boundary
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#4ecdc4';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        let generateTimeout = null;
        function debouncedGenerate() {
            document.getElementById('depthVal').textContent = depthSlider.value;
            clearTimeout(generateTimeout);
            generateTimeout = setTimeout(generate, 150);
        }

        tilingSelect.addEventListener('change', generate);
        depthSlider.addEventListener('input', debouncedGenerate);
        colorSelect.addEventListener('change', draw);
        showEdgesCheck.addEventListener('change', draw);
        document.getElementById('regenerate').addEventListener('click', generate);

        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
