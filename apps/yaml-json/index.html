<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAML ↔ JSON Converter - AI Showcase</title>
    <link rel="icon" href="../../favicons/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
        .subtitle { color: #666; margin-bottom: 32px; }
        .back-link {
            position: fixed; top: 20px; right: 20px; color: #666; text-decoration: none;
            font-size: 14px; padding: 8px 14px; background: rgba(0,0,0,0.85);
            border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
        }
        .back-link:hover { color: #fff; }
        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .mode-btn {
            flex: 1;
            max-width: 200px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: #888;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .mode-btn.active {
            background: rgba(78, 205, 196, 0.15);
            border-color: rgba(78, 205, 196, 0.5);
            color: #4ecdc4;
        }
        .converter {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
        }
        @media (max-width: 800px) {
            .converter { grid-template-columns: 1fr; }
            .arrow { transform: rotate(90deg); }
        }
        .panel {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .panel-title { font-size: 0.9rem; color: #888; }
        .panel-actions { display: flex; gap: 8px; }
        .panel-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #888;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .panel-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        textarea {
            width: 100%;
            height: 450px;
            background: transparent;
            border: none;
            color: #fff;
            padding: 16px;
            font-family: 'SF Mono', Monaco, 'Consolas', monospace;
            font-size: 0.9rem;
            resize: vertical;
        }
        textarea:focus { outline: none; }
        textarea::placeholder { color: #444; }
        .arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ecdc4;
            font-size: 1.5rem;
        }
        .options {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .option label { color: #888; font-size: 0.9rem; }
        .option select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 0.9rem;
        }
        .success {
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid rgba(78, 205, 196, 0.3);
            color: #4ecdc4;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-link">← Back</a>
    <div class="container">
        <h1>YAML ↔ JSON Converter</h1>
        <p class="subtitle">Convert between YAML and JSON formats for config files and APIs.</p>

        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="yaml-to-json">YAML → JSON</button>
            <button class="mode-btn" data-mode="json-to-yaml">JSON → YAML</button>
        </div>

        <div class="options">
            <div class="option">
                <label for="jsonIndent">JSON indent:</label>
                <select id="jsonIndent">
                    <option value="2">2 spaces</option>
                    <option value="4">4 spaces</option>
                    <option value="0">Minified</option>
                </select>
            </div>
            <div class="option">
                <label for="yamlIndent">YAML indent:</label>
                <select id="yamlIndent">
                    <option value="2">2 spaces</option>
                    <option value="4">4 spaces</option>
                </select>
            </div>
        </div>

        <div class="converter">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title" id="inputLabel">YAML Input</span>
                    <div class="panel-actions">
                        <button class="panel-btn" id="pasteBtn">Paste</button>
                        <button class="panel-btn" id="clearBtn">Clear</button>
                        <button class="panel-btn" id="sampleBtn">Sample</button>
                    </div>
                </div>
                <textarea id="input" placeholder="Paste your YAML here..."></textarea>
            </div>

            <div class="arrow">→</div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title" id="outputLabel">JSON Output</span>
                    <div class="panel-actions">
                        <button class="panel-btn" id="copyBtn">Copy</button>
                        <button class="panel-btn" id="downloadBtn">Download</button>
                    </div>
                </div>
                <textarea id="output" readonly placeholder="Converted output will appear here..."></textarea>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        // YAML parser for the block subset people paste: nested maps and lists, comments,
        // quoted scalars, block scalars (| and >) and flow collections. No anchors, tags or multi-docs.
        function parseYaml(yaml) {
            const lines = yaml.replace(/\r\n?/g, '\n').split('\n');
            let pos = 0;
            let cur = null; // cached significant line at pos; a list item's inline content replaces it

            function fail(msg) {
                throw new Error(msg + ' (line ' + Math.min(pos + 1, lines.length) + ')');
            }

            function peek() {
                if (cur) return cur;
                for (; pos < lines.length; pos++) {
                    const raw = lines[pos];
                    const text = stripYamlComment(raw).trim();
                    if (!text) continue;
                    const indent = raw.search(/\S/);
                    if (raw.slice(0, indent).includes('\t')) fail('Tabs cannot be used for indentation');
                    return cur = { indent, text };
                }
                return null;
            }

            function advance() {
                cur = null;
                pos++;
            }

            function isSeqEntry(text) {
                return text === '-' || text.startsWith('- ');
            }

            function parseNode(indent) {
                const line = peek();
                if (isSeqEntry(line.text)) return parseSeq(indent);
                if (splitYamlKey(line.text)) return parseMap(indent);
                advance();
                return parseScalar(line.text, indent - 1);
            }

            function parseSeq(indent) {
                const arr = [];
                let line;
                while ((line = peek()) && line.indent === indent && isSeqEntry(line.text)) {
                    const rest = line.text.slice(1).trim();
                    if (!rest) {
                        advance();
                        const next = peek();
                        arr.push(next && next.indent > indent ? parseNode(next.indent) : null);
                    } else if (isSeqEntry(rest) || splitYamlKey(rest)) {
                        // "- key: value" / "- - x": the rest of the line is a nested block
                        // whose indent is the column where it starts
                        cur = { indent: indent + line.text.length - rest.length, text: rest };
                        arr.push(parseNode(cur.indent));
                    } else {
                        advance();
                        arr.push(parseScalar(rest, indent));
                    }
                }
                if (line && line.indent > indent) fail('Unexpected indentation');
                return arr;
            }

            function parseMap(indent) {
                const obj = {};
                let line;
                while ((line = peek()) && line.indent === indent) {
                    const kv = splitYamlKey(line.text);
                    if (!kv) fail('Expected "key: value"');
                    advance();
                    let value = null;
                    if (kv.rest === '') {
                        const next = peek();
                        if (next && next.indent > indent) value = parseNode(next.indent);
                        // a list may sit at the same indent as its key
                        else if (next && next.indent === indent && isSeqEntry(next.text)) value = parseSeq(indent);
                    } else {
                        value = parseScalar(kv.rest, indent);
                    }
                    setYamlKey(obj, kv.key, value);
                }
                if (line && line.indent > indent) fail('Unexpected indentation');
                return obj;
            }

            // text is the scalar's first line (already consumed); parentIndent is the indent
            // that continuation lines and block scalar content must exceed
            function parseScalar(text, parentIndent) {
                const block = /^([|>])([+-]?[1-9]?|[1-9][+-])$/.exec(text);
                if (block) return parseBlockScalar(block[1], block[2], parentIndent);
                if (text[0] === '"' || text[0] === "'") {
                    const q = readYamlQuoted(text, 0);
                    if (!q) fail('Unterminated quoted string');
                    if (q.end !== text.length) fail('Unexpected text after quoted string');
                    return q.value;
                }
                if (text[0] === '[' || text[0] === '{') {
                    for (;;) {
                        try {
                            return parseYamlFlow(text);
                        } catch (e) {
                            const next = e.incomplete && peek();
                            if (!next) fail(e.message);
                            text += ' ' + next.text;
                            advance();
                        }
                    }
                }
                // plain scalars may continue on more-indented lines
                let next;
                while ((next = peek()) && next.indent > parentIndent) {
                    if (isSeqEntry(next.text) || splitYamlKey(next.text)) fail('Unexpected indentation');
                    text += ' ' + next.text;
                    advance();
                }
                return parseYamlPlain(text);
            }

            function parseBlockScalar(style, indicators, parentIndent) {
                const chomp = (/[+-]/.exec(indicators) || [''])[0];
                const explicit = /[1-9]/.exec(indicators);
                let contentIndent = explicit ? Math.max(parentIndent, 0) + Number(explicit[0]) : -1;
                const out = [];
                while (pos < lines.length) {
                    const raw = lines[pos];
                    if (raw.trim() === '') {
                        out.push('');
                    } else {
                        const indent = raw.search(/\S/);
                        if (contentIndent < 0) {
                            if (indent <= parentIndent) break;
                            contentIndent = indent;
                        } else if (indent < contentIndent) {
                            break;
                        }
                        out.push(raw.slice(contentIndent));
                    }
                    pos++;
                }
                let trailing = 0;
                while (out.length && out[out.length - 1] === '') {
                    out.pop();
                    trailing++;
                }
                let body;
                if (style === '|') {
                    body = out.join('\n');
                } else {
                    // folded: a single line break becomes a space, blank and more-indented lines keep theirs
                    body = '';
                    let blanks = 0;
                    let prev = null;
                    for (const l of out) {
                        if (l === '') {
                            blanks++;
                            continue;
                        }
                        const literal = /^\s/.test(l) || (prev !== null && /^\s/.test(prev));
                        if (prev === null) body += '\n'.repeat(blanks);
                        else if (literal) body += '\n'.repeat(blanks + 1);
                        else body += blanks ? '\n'.repeat(blanks) : ' ';
                        body += l;
                        blanks = 0;
                        prev = l;
                    }
                }
                if (chomp === '-') return body;
                if (chomp === '+') return body + '\n'.repeat(trailing + (out.length ? 1 : 0));
                return body ? body + '\n' : '';
            }

            let first = peek();
            if (first && first.text === '---') {
                advance();
                first = peek();
            }
            if (!first) return null;
            const result = parseNode(first.indent);
            const extra = peek();
            if (extra) {
                fail(extra.text === '---' ? 'Multiple YAML documents are not supported' :
                    extra.indent < first.indent ? 'Unexpected indentation' : 'Unexpected content');
            }
            return result;
        }

        function setYamlKey(obj, key, value) {
            // plain assignment to "__proto__" would change the prototype instead of adding a key
            Object.defineProperty(obj, key, { value, enumerable: true, writable: true, configurable: true });
        }

        // Cut a trailing "# comment"; a # inside quotes or not preceded by whitespace is content
        function stripYamlComment(s) {
            let quote = '';
            for (let i = 0; i < s.length; i++) {
                const c = s[i];
                if (quote) {
                    if (c === '\\' && quote === '"') i++;
                    else if (c === "'" && quote === "'" && s[i + 1] === "'") i++;
                    else if (c === quote) quote = '';
                } else if (c === '#' && (i === 0 || /\s/.test(s[i - 1]))) {
                    return s.slice(0, i);
                } else if ((c === '"' || c === "'") && /(^|[\[{,]|[:-]\s)\s*$/.test(s.slice(0, i))) {
                    // only a quote that starts a scalar opens a string (not the one in "don't")
                    quote = c;
                }
            }
            return s;
        }

        // Read the quoted scalar starting at s[i]; returns null if it never closes
        function readYamlQuoted(s, i) {
            const quote = s[i];
            const escapes = { n: '\n', t: '\t', r: '\r', 0: '\0', a: '\x07', b: '\b', e: '\x1b', f: '\f', v: '\v', N: '\x85', _: '\xa0' };
            const hexLen = { x: 2, u: 4, U: 8 };
            let out = '';
            for (let j = i + 1; j < s.length; j++) {
                const c = s[j];
                if (quote === "'") {
                    if (c !== "'") out += c;
                    else if (s[j + 1] === "'") { out += "'"; j++; }
                    else return { value: out, end: j + 1 };
                } else if (c === '\\') {
                    const e = s[++j];
                    if (e === undefined) return null;
                    if (hexLen[e]) {
                        const hex = s.substr(j + 1, hexLen[e]);
                        if (hex.length !== hexLen[e] || !/^[0-9a-fA-F]+$/.test(hex) || parseInt(hex, 16) > 0x10FFFF) {
                            throw new Error('Invalid escape \\' + e + hex);
                        }
                        out += String.fromCodePoint(parseInt(hex, 16));
                        j += hexLen[e];
                    } else {
                        out += Object.prototype.hasOwnProperty.call(escapes, e) ? escapes[e] : e;
                    }
                } else if (c === '"') {
                    return { value: out, end: j + 1 };
                } else {
                    out += c;
                }
            }
            return null;
        }

        // "key: rest" -> { key, rest }, or null when the text is not a mapping entry
        function splitYamlKey(text) {
            if (text[0] === '"' || text[0] === "'") {
                let q;
                try { q = readYamlQuoted(text, 0); } catch (e) { return null; }
                if (!q) return null;
                const m = /^\s*:(\s+|$)/.exec(text.slice(q.end));
                return m ? { key: q.value, rest: text.slice(q.end + m[0].length).trim() } : null;
            }
            if (text[0] === '[' || text[0] === '{') return null;
            const m = /:(\s|$)/.exec(text);
            if (!m) return null;
            return { key: text.slice(0, m.index).trim(), rest: text.slice(m.index + 1).trim() };
        }

        // Flow collection on one logical line: [a, "b", {c: 1}]
        function parseYamlFlow(s) {
            let i = 0;
            function incomplete() {
                const e = new Error('Unterminated flow collection');
                e.incomplete = true;
                throw e;
            }
            function ws() {
                while (i < s.length && /\s/.test(s[i])) i++;
            }
            // returns the raw scalar and whether it was quoted
            function scalar() {
                if (s[i] === '"' || s[i] === "'") {
                    const q = readYamlQuoted(s, i);
                    if (!q) incomplete();
                    i = q.end;
                    return { text: q.value, quoted: true };
                }
                const start = i;
                while (i < s.length && !',]}'.includes(s[i]) &&
                    !(s[i] === ':' && (i + 1 === s.length || /[\s,\]}]/.test(s[i + 1])))) i++;
                return { text: s.slice(start, i).trim(), quoted: false };
            }
            function value() {
                ws();
                if (i >= s.length) incomplete();
                if (s[i] === '[') return seq();
                if (s[i] === '{') return map();
                const sc = scalar();
                return sc.quoted ? sc.text : parseYamlPlain(sc.text);
            }
            function separator(close) {
                ws();
                if (i >= s.length) incomplete();
                if (s[i] === ',') i++;
                else if (s[i] !== close) throw new Error('Expected "," or "' + close + '" in flow collection');
            }
            function seq() {
                const arr = [];
                i++;
                for (;;) {
                    ws();
                    if (i >= s.length) incomplete();
                    if (s[i] === ']') { i++; return arr; }
                    arr.push(value());
                    separator(']');
                }
            }
            function map() {
                const obj = {};
                i++;
                for (;;) {
                    ws();
                    if (i >= s.length) incomplete();
                    if (s[i] === '}') { i++; return obj; }
                    const key = scalar().text;
                    ws();
                    let val = null;
                    if (s[i] === ':') {
                        i++;
                        ws();
                        if (s[i] !== ',' && s[i] !== '}') val = value();
                    }
                    setYamlKey(obj, key, val);
                    separator('}');
                }
            }
            const result = value();
            ws();
            if (i < s.length) throw new Error('Unexpected text after flow collection');
            return result;
        }

        // Unquoted scalar -> null, boolean, number or string
        function parseYamlPlain(val) {
            if (val === '' || val === '~' || val === 'null' || val === 'Null' || val === 'NULL') return null;
            if (val === 'true' || val === 'True' || val === 'TRUE') return true;
            if (val === 'false' || val === 'False' || val === 'FALSE') return false;
            if (/^[-+]?\d+$/.test(val)) return parseInt(val, 10);
            if (/^0x[0-9a-fA-F]+$/.test(val)) return parseInt(val, 16);
            if (/^0o[0-7]+$/.test(val)) return parseInt(val.slice(2), 8);
            if (/^[-+]?(\.\d+|\d+(\.\d*)?)([eE][-+]?\d+)?$/.test(val)) return parseFloat(val);
            return val;
        }

        // JSON to YAML converter
        function jsonToYaml(obj, indent = 0, indentSize = 2) {
            const spaces = ' '.repeat(indent);
            const isBlock = v => typeof v === 'object' && v !== null && (Array.isArray(v) ? v.length : Object.keys(v).length) > 0;
            if (!isBlock(obj)) return spaces + formatYamlValue(obj, indent + indentSize) + '\n';

            let yaml = '';
            if (Array.isArray(obj)) {
                for (const item of obj) {
                    if (isBlock(item)) {
                        // the nested block starts on the dash line, so its content sits 2 columns in
                        yaml += spaces + '- ' + jsonToYaml(item, indent + 2, indentSize).slice(indent + 2);
                    } else {
                        yaml += spaces + '- ' + formatYamlValue(item, indent + 2) + '\n';
                    }
                }
            } else {
                for (const [key, value] of Object.entries(obj)) {
                    if (isBlock(value)) {
                        yaml += spaces + formatYamlString(key) + ':\n';
                        yaml += jsonToYaml(value, indent + indentSize, indentSize);
                    } else {
                        yaml += spaces + formatYamlString(key) + ': ' + formatYamlValue(value, indent + indentSize) + '\n';
                    }
                }
            }

            return yaml;
        }

        // blockIndent is the column a block scalar's content is written at
        function formatYamlValue(val, blockIndent = 2) {
            if (val === null) return 'null';
            if (typeof val === 'boolean') return val ? 'true' : 'false';
            if (typeof val === 'number') return Object.is(val, -0) ? '-0' : String(val);
            if (typeof val === 'string') {
                // Literal block only where it round-trips: starts with text, no whitespace-only
                // lines, at most one trailing newline, no control characters
                if (val.includes('\n') && /^\S/.test(val) && !/\n\n$/.test(val) &&
                    !/\n[^\S\n]+(\n|$)/.test(val) && !/[\x00-\x08\x0b-\x1f\x7f\x85\u2028\u2029]/.test(val)) {
                    const keepNewline = val.endsWith('\n');
                    const body = keepNewline ? val.slice(0, -1) : val;
                    const pad = ' '.repeat(blockIndent);
                    return (keepNewline ? '|' : '|-') + '\n' + body.split('\n').map(l => l ? pad + l : '').join('\n');
                }
                return formatYamlString(val);
            }
            if (Array.isArray(val)) return '[]';
            if (typeof val === 'object') return '{}';
            return String(val);
        }

        // Plain where a YAML parser would read the same string back, otherwise double-quoted
        function formatYamlString(val) {
            // digit-led strings are quoted too: YAML 1.1 parsers read 1_000, 12:30 and 2020-01-01 as numbers or dates
            if (val === '' || parseYamlPlain(val) !== val || /^[-+]?[._]*\d/.test(val) ||
                /^(y|n|yes|no|on|off|true|false|null|=|<<|[-+]?\.(inf|nan))$/i.test(val) ||
                /^\s|\s$/.test(val) || /^[-?](\s|$)/.test(val) || /^[:,\[\]{}#&*!|>'"%@`]/.test(val) ||
                /^(---|\.\.\.)/.test(val) || /:(\s|$)/.test(val) || /\s#/.test(val) ||
                /[\x00-\x1f\x7f\x85\u2028\u2029\ufeff]/.test(val)) {
                return JSON.stringify(val).replace(/[\x7f\x85\u2028\u2029\ufeff]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
            }
            return val;
        }

        let mode = 'yaml-to-json';
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const messageEl = document.getElementById('message');

        function convert() {
            const text = input.value.trim();
            if (!text) {
                output.value = '';
                messageEl.innerHTML = '';
                return;
            }

            try {
                if (mode === 'yaml-to-json') {
                    // untrimmed: the first line's indentation matters
                    const parsed = parseYaml(input.value);
                    const indent = parseInt(document.getElementById('jsonIndent').value);
                    output.value = JSON.stringify(parsed, null, indent || undefined);
                } else {
                    const parsed = JSON.parse(text);
                    const indent = parseInt(document.getElementById('yamlIndent').value);
                    output.value = jsonToYaml(parsed, 0, indent);
                }
                messageEl.innerHTML = '<div class="success">Conversion successful!</div>';
            } catch (e) {
                output.value = '';
                messageEl.innerHTML = '<div class="error"></div>';
                messageEl.firstChild.textContent = 'Error: ' + e.message;
            }
        }

        function updateMode() {
            document.getElementById('inputLabel').textContent = mode === 'yaml-to-json' ? 'YAML Input' : 'JSON Input';
            document.getElementById('outputLabel').textContent = mode === 'yaml-to-json' ? 'JSON Output' : 'YAML Output';
            input.placeholder = mode === 'yaml-to-json' ? 'Paste your YAML here...' : 'Paste your JSON here...';
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.dataset.mode === mode) return;
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mode = btn.dataset.mode;
                updateMode();
                // Only swap if output has content (successful prior conversion)
                if (output.value.trim()) {
                    const temp = input.value;
                    input.value = output.value;
                    output.value = temp;
                }
                convert();
            });
        });

        document.getElementById('sampleBtn').addEventListener('click', () => {
            if (mode === 'yaml-to-json') {
                input.value = `# Sample YAML configuration
server:
  host: localhost
  port: 8080
  ssl: true

database:
  type: postgresql
  connection:
    host: db.example.com
    port: 5432
    name: myapp

features:
  - authentication
  - logging
  - caching

users:
  - name: admin
    role: superuser
    active: true
  - name: guest
    role: viewer
    active: false

settings:
  timeout: 30
  retries: 3
  debug: false`;
            } else {
                input.value = `{
  "server": {
    "host": "localhost",
    "port": 8080,
    "ssl": true
  },
  "database": {
    "type": "postgresql",
    "connection": {
      "host": "db.example.com",
      "port": 5432,
      "name": "myapp"
    }
  },
  "features": ["authentication", "logging", "caching"],
  "users": [
    {"name": "admin", "role": "superuser", "active": true},
    {"name": "guest", "role": "viewer", "active": false}
  ],
  "settings": {
    "timeout": 30,
    "retries": 3,
    "debug": false
  }
}`;
            }
            convert();
        });

        document.getElementById('pasteBtn').addEventListener('click', async () => {
            try {
                input.value = await navigator.clipboard.readText();
                convert();
            } catch (e) {
                messageEl.innerHTML = '<div class="error">Failed to paste from clipboard</div>';
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            input.value = '';
            output.value = '';
            messageEl.innerHTML = '';
        });

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
            }
            return fallbackCopy(text);
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            return ok ? Promise.resolve() : Promise.reject(new Error('Copy failed'));
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            const btn = document.getElementById('copyBtn');
            copyToClipboard(output.value).then(() => {
                btn.textContent = 'Copied!';
            }, () => {
                btn.textContent = 'Copy failed';
            }).then(() => setTimeout(() => btn.textContent = 'Copy', 1500));
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!output.value.trim()) return;
            const ext = mode === 'yaml-to-json' ? 'json' : 'yaml';
            const type = mode === 'yaml-to-json' ? 'application/json' : 'text/yaml';
            const blob = new Blob([output.value], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `converted.${ext}`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        input.addEventListener('input', convert);
        document.getElementById('jsonIndent').addEventListener('change', convert);
        document.getElementById('yamlIndent').addEventListener('change', convert);

        // Pre-fill with sample data
        input.value = `# Server configuration
server:
  host: localhost
  port: 8080
  ssl: true

database:
  type: postgresql
  host: db.example.com
  port: 5432

features:
  - authentication
  - logging
  - caching

settings:
  timeout: 30
  debug: false`;
        convert();
    </script>
</body>
</html>
