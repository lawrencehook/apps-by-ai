<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filters - AI Showcase</title><script src="../../site-theme.js"></script>
    <link rel="icon" href="../../favicons/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: light-dark(#efeff3, #0a0a0f);
            min-height: 100vh;
            color: light-dark(#2c2c2c, #e0e0e0);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: light-dark(#0f0f0f, #fff); }
        .subtitle { color: light-dark(#616161, #666); margin-bottom: 32px; }
        .back-link {
            position: fixed; top: 20px; right: 20px; color: light-dark(#616161, #666); text-decoration: none;
            font-size: 14px; padding: 8px 14px; background: light-dark(#fcfcfcd9, rgba(0,0,0,0.85));
            border-radius: 6px; border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1)); z-index: 100;
        }
        .back-link:hover { color: light-dark(#0f0f0f, #fff); }
        .drop-zone {
            border: 2px dashed light-dark(#0f0f0f33, rgba(255,255,255,0.2));
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: light-dark(#44aea6, #4ecdc4);
            background: light-dark(#44aea60d, rgba(78, 205, 196, 0.05));
        }
        .drop-zone-text { color: light-dark(#616161, #888); font-size: 1.1rem; }
        .drop-zone-hint { color: light-dark(#616161, #555); font-size: 0.85rem; margin-top: 8px; }
        input[type="file"] { display: none; }
        .editor-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .editor-layout { grid-template-columns: 1fr; }
        }
        .sidebar {
            background: light-dark(#0f0f0f08, rgba(255,255,255,0.03));
            border-radius: 8px;
            border: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .section { margin-bottom: 20px; }
        .section-title {
            font-size: 0.85rem;
            color: light-dark(#616161, #888);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .slider-group { margin-bottom: 14px; }
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .slider-label { color: light-dark(#5e5e5e, #aaa); font-size: 0.85rem; }
        .slider-value { color: light-dark(#378b85, #4ecdc4); font-size: 0.85rem; font-weight: 500; }
        input[type="range"] {
            width: 100%;
            accent-color: light-dark(#44aea6, #4ecdc4);
        }
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .preset-btn {
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border: 1px solid light-dark(#0f0f0f1a, rgba(255,255,255,0.1));
            color: light-dark(#616161, #888);
            padding: 10px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .preset-btn:hover { background: light-dark(#0f0f0f1a, rgba(255,255,255,0.1)); color: light-dark(#0f0f0f, #fff); }
        .preset-btn.active {
            background: light-dark(#44aea633, rgba(78, 205, 196, 0.2));
            border-color: light-dark(#44aea666, rgba(78, 205, 196, 0.4));
            color: light-dark(#378b85, #4ecdc4);
        }
        button:not(.preset-btn) {
            background: light-dark(#44aea633, rgba(78, 205, 196, 0.2));
            border: 1px solid light-dark(#44aea666, rgba(78, 205, 196, 0.4));
            color: light-dark(#378b85, #4ecdc4);
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            width: 100%;
        }
        button:hover { background: light-dark(#44aea64c, rgba(78, 205, 196, 0.3)); }
        button.secondary {
            background: light-dark(#0f0f0f0d, rgba(255,255,255,0.05));
            border-color: light-dark(#0f0f0f33, rgba(255,255,255,0.2));
            color: light-dark(#616161, #888);
            margin-top: 12px;
        }
        button.secondary:hover { background: light-dark(#0f0f0f1a, rgba(255,255,255,0.1)); color: light-dark(#0f0f0f, #fff); }
        .preview-area {
            background: light-dark(#0f0f0f05, rgba(255,255,255,0.02));
            border-radius: 8px;
            border: 1px solid light-dark(#0f0f0f14, rgba(255,255,255,0.08));
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        .preview-area canvas {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 4px;
        }
        .status {
            margin-top: 24px;
            padding: 16px;
            background: light-dark(#44aea61a, rgba(78, 205, 196, 0.1));
            border-radius: 8px;
            color: light-dark(#378b85, #4ecdc4);
            display: none;
            text-align: center;
        }
        .status.show { display: block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-link">← Back</a>
    <div class="container">
        <h1>Image Filters</h1>
        <p class="subtitle">Apply adjustments and filters to your images.</p>

        <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Upload image area. Drop an image here or press Enter to browse.">
            <div class="drop-zone-text">Drop an image here or click to browse</div>
            <div class="drop-zone-hint">Supports PNG, JPEG, WebP</div>
            <input type="file" id="fileInput" accept="image/*" aria-label="Choose image file">
        </div>

        <div class="editor-layout hidden" id="editorPanel">
            <div class="sidebar">
                <div class="section">
                    <div class="section-title">Presets</div>
                    <div class="preset-grid">
                        <button class="preset-btn" data-preset="none">Original</button>
                        <button class="preset-btn" data-preset="grayscale">Grayscale</button>
                        <button class="preset-btn" data-preset="sepia">Sepia</button>
                        <button class="preset-btn" data-preset="vintage">Vintage</button>
                        <button class="preset-btn" data-preset="cold">Cold</button>
                        <button class="preset-btn" data-preset="warm">Warm</button>
                        <button class="preset-btn" data-preset="dramatic">Dramatic</button>
                        <button class="preset-btn" data-preset="fade">Faded</button>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Adjustments</div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="slider-label">Brightness</span>
                            <span class="slider-value" id="brightnessValue">100%</span>
                        </div>
                        <input type="range" id="brightness" aria-label="Brightness" min="0" max="200" value="100">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="slider-label">Contrast</span>
                            <span class="slider-value" id="contrastValue">100%</span>
                        </div>
                        <input type="range" id="contrast" aria-label="Contrast" min="0" max="200" value="100">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="slider-label">Saturation</span>
                            <span class="slider-value" id="saturateValue">100%</span>
                        </div>
                        <input type="range" id="saturate" aria-label="Saturation" min="0" max="200" value="100">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="slider-label">Hue Rotate</span>
                            <span class="slider-value" id="hueValue">0°</span>
                        </div>
                        <input type="range" id="hue" aria-label="Hue Rotate" min="0" max="360" value="0">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="slider-label">Blur</span>
                            <span class="slider-value" id="blurValue">0px</span>
                        </div>
                        <input type="range" id="blur" aria-label="Blur" min="0" max="20" value="0">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="slider-label">Invert</span>
                            <span class="slider-value" id="invertValue">0%</span>
                        </div>
                        <input type="range" id="invert" aria-label="Invert" min="0" max="100" value="0">
                    </div>
                </div>

                <button id="downloadBtn">Download</button>
                <button id="resetBtn" class="secondary">Choose Different Image</button>
            </div>

            <div class="preview-area">
                <canvas id="previewCanvas"></canvas>
            </div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        let currentImage = null;
        let filters = {
            brightness: 100,
            contrast: 100,
            saturate: 100,
            hue: 0,
            blur: 0,
            invert: 0
        };

        const presets = {
            none: { brightness: 100, contrast: 100, saturate: 100, hue: 0, blur: 0, invert: 0 },
            grayscale: { brightness: 100, contrast: 110, saturate: 0, hue: 0, blur: 0, invert: 0 },
            sepia: { brightness: 100, contrast: 90, saturate: 50, hue: 30, blur: 0, invert: 0 },
            vintage: { brightness: 110, contrast: 85, saturate: 70, hue: 15, blur: 0, invert: 0 },
            cold: { brightness: 100, contrast: 100, saturate: 90, hue: 200, blur: 0, invert: 0 },
            warm: { brightness: 105, contrast: 100, saturate: 110, hue: 350, blur: 0, invert: 0 },
            dramatic: { brightness: 90, contrast: 150, saturate: 120, hue: 0, blur: 0, invert: 0 },
            fade: { brightness: 110, contrast: 80, saturate: 80, hue: 0, blur: 0, invert: 0 }
        };

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const editorPanel = document.getElementById('editorPanel');
        const previewCanvas = document.getElementById('previewCanvas');
        const status = document.getElementById('status');

        // Drop zone events
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileInput.click();
            }
        });
        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
            fileInput.value = ''; // so picking the same file again fires change
        });

        function showStatus(message) {
            status.textContent = message;
            status.className = 'status show';
        }

        // Canvas only encodes PNG, JPEG and WebP; other inputs (GIF, BMP, SVG) are saved as PNG
        function outputType(type) {
            return ['image/png', 'image/jpeg', 'image/webp'].includes(type) ? type : 'image/png';
        }

        function downloadCanvas(canvas, type, quality, baseName, done) {
            canvas.toBlob(blob => {
                if (!blob) { done(null); return; }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                // blob.type is what the browser really encoded (PNG if it lacks the requested encoder)
                a.download = `${baseName}.${(blob.type || 'image/png').split('/')[1]}`;
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                done(blob);
            }, type, quality);
        }

        // Safari's 2D context has no `filter` property; assigning it would silently do nothing
        const supportsFilter = typeof previewCanvas.getContext('2d').filter === 'string';

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showStatus('Please select a valid image file.');
                return;
            }

            currentImage = { file, type: file.type };
            filters = { ...presets.none };

            const reader = new FileReader();
            reader.onerror = () => showStatus('Error reading file. Please try again.');
            reader.onload = e => {
                const img = new Image();
                img.onerror = () => {
                    showStatus('Could not load image. The file may be corrupt.');
                    currentImage = null;
                };
                img.onload = () => {
                    currentImage.img = img;
                    updateSliders();
                    updatePreview();
                    // Clear active preset state
                    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                    dropZone.classList.add('hidden');
                    editorPanel.classList.remove('hidden');
                    if (supportsFilter) {
                        status.classList.remove('show');
                    } else {
                        showStatus('This browser does not support canvas filters, so the adjustments cannot be applied here. Try Chrome, Edge or Firefox.');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateSliders() {
            document.getElementById('brightness').value = filters.brightness;
            document.getElementById('brightnessValue').textContent = filters.brightness + '%';

            document.getElementById('contrast').value = filters.contrast;
            document.getElementById('contrastValue').textContent = filters.contrast + '%';

            document.getElementById('saturate').value = filters.saturate;
            document.getElementById('saturateValue').textContent = filters.saturate + '%';

            document.getElementById('hue').value = filters.hue;
            document.getElementById('hueValue').textContent = filters.hue + '°';

            document.getElementById('blur').value = filters.blur;
            document.getElementById('blurValue').textContent = filters.blur + 'px';

            document.getElementById('invert').value = filters.invert;
            document.getElementById('invertValue').textContent = filters.invert + '%';
        }

        // Draw the filtered image at `scale` of full size. Blur is in image pixels,
        // so it shrinks with the scale to look the same as the full-size output.
        function renderFiltered(canvas, scale) {
            const img = currentImage.img;
            const ctx = canvas.getContext('2d');

            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));

            // Apply CSS filters
            ctx.filter = `
                brightness(${filters.brightness}%)
                contrast(${filters.contrast}%)
                saturate(${filters.saturate}%)
                hue-rotate(${filters.hue}deg)
                blur(${filters.blur * scale}px)
                invert(${filters.invert}%)
            `;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        }

        const MAX_PREVIEW = 1600;
        let previewQueued = false;

        // The preview is capped in size and redrawn at most once per frame;
        // the download renders at full resolution.
        function updatePreview() {
            if (previewQueued) return;
            previewQueued = true;
            requestAnimationFrame(() => {
                previewQueued = false;
                if (!currentImage || !currentImage.img) return;
                const img = currentImage.img;
                renderFiltered(previewCanvas, Math.min(1, MAX_PREVIEW / Math.max(img.width, img.height)));
            });
        }

        // Slider events
        ['brightness', 'contrast', 'saturate', 'hue', 'blur', 'invert'].forEach(name => {
            const slider = document.getElementById(name);
            slider.addEventListener('input', () => {
                filters[name] = parseInt(slider.value);
                const suffix = name === 'hue' ? '°' : (name === 'blur' ? 'px' : '%');
                document.getElementById(name + 'Value').textContent = filters[name] + suffix;
                updatePreview();

                // Deselect presets
                document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            });
        });

        // Preset buttons
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const preset = presets[btn.dataset.preset];
                filters = { ...preset };
                updateSliders();
                updatePreview();

                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!currentImage || !currentImage.img) return;
            const format = outputType(currentImage.type);
            const quality = format === 'image/jpeg' ? 0.92 : undefined;
            const canvas = document.createElement('canvas');
            renderFiltered(canvas, 1);

            const baseName = currentImage.file.name.replace(/\.[^.]+$/, '');
            downloadCanvas(canvas, format, quality, `${baseName}_filtered`, blob => {
                showStatus(blob ? 'Image downloaded!' : 'Could not encode the image.');
            });
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            currentImage = null;
            fileInput.value = '';
            dropZone.classList.remove('hidden');
            editorPanel.classList.add('hidden');
            status.classList.remove('show');
        });
    </script>
</body>
</html>
