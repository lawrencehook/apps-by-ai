<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Johann Sebastian Bach · Scores</title>
<style>
:root{color-scheme:dark;--ink:#efede0;--muted:#b4beb6;--rule:#36413d;--gold:#e9ce80}
*{box-sizing:border-box}body{margin:0;background:#0b1012;color:var(--ink);font:16px/1.45 "Instrument Sans",system-ui,sans-serif}
main{max-width:1180px;margin:auto;padding:clamp(20px,5vw,64px)}
footer,.section{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font:normal clamp(52px,8vw,94px)/1 Georgia,serif;letter-spacing:-.065em;margin:36px 0 26px;padding-bottom:20px;border-bottom:1px solid var(--rule)}a{color:inherit;text-decoration:none}
.feature{background:#141c1b;border:1px solid #465043;display:grid;grid-template-columns:minmax(215px,.85fr) 1.4fr;align-items:center;padding:24px clamp(20px,3.5vw,42px);gap:20px}
.feature canvas{width:100%;height:150px;display:block}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}
h2,h3{font-family:Georgia,serif;font-weight:normal;letter-spacing:-.035em}
.feature h2{font-size:clamp(28px,3.6vw,47px);line-height:1.1;margin:10px 0}.meta,footer{font-size:13px;color:var(--muted)}
.section{margin:35px 0 10px;align-items:baseline}.section h2{font-size:31px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:34px}
.work{border-top:1px solid var(--rule);display:grid;grid-template-columns:36px 1fr minmax(50px,100px) 38px;align-items:center;gap:10px;padding:16px 3px}
.number,.time{font:12px ui-monospace,monospace;color:var(--muted)}.time{text-align:right}.work h3{font-size:22px;margin:0 0 2px}.work canvas,.pair canvas{width:100%;height:42px;opacity:.85}
a:hover h2,a:hover h3{color:var(--gold)}a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
footer{margin-top:30px;border-top:1px solid var(--rule);padding-top:14px;flex-wrap:wrap}footer a{text-decoration:underline;text-underline-offset:3px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.feature{grid-template-columns:1fr}.feature canvas{height:95px}.work{grid-template-columns:30px 1fr 65px 35px}.section h2{font-size:26px}}
nav{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:28px;font-size:14px;color:var(--muted)}nav a[aria-current],nav a:hover{color:var(--gold)}
#featured-works{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
#featured-works .feature{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:20px}
.feature h3{font-size:clamp(24px,2.5vw,33px);line-height:1.12;margin:0}
.feature .meta{margin-top:auto}
.feature canvas{height:84px}
.pair{display:grid;grid-template-columns:minmax(140px,1fr) 1fr 1fr;gap:12px;align-items:center;border-top:1px solid var(--rule);padding:12px 0}.pair h3{margin:0;font-size:21px}.pair a{display:grid;grid-template-columns:minmax(0,1fr) minmax(50px,100px);align-items:center;gap:6px;padding:5px 0}.pair a:hover{text-decoration:underline}.pair small{display:block;color:var(--muted);font-size:12px}
@media(max-width:720px){.pair a{grid-template-columns:minmax(0,1fr)}.pair canvas{max-width:100px}}
@media(max-width:540px){.pair{grid-template-columns:1.1fr 1fr 1fr;gap:6px}.pair h3{font-size:17px}.section:has(#clavier-title){flex-wrap:wrap}}
</style>
<main>
<nav aria-label="Site sections"><a href="../index.html">Apps</a><a href="../games/index.html">Games</a><a href="../notes/index.html">Notes</a><a href="index.html" aria-current="page">Music</a></nav>
<h1 class="title">Johann Sebastian Bach</h1>
<section aria-labelledby="selected-heading"><div class="section"><h2 id="selected-heading">Selected works</h2></div>
<div id="featured-works"></div></section>
<div class="section"><h2>Two-Part Inventions</h2><span class="meta" id="count"></span></div>
<div class="grid" id="works"></div>
<div class="section"><h2>Three-Part Sinfonias</h2><span class="meta" id="sinfonia-count"></span></div>
<div class="grid" id="sinfonias"></div>
<div class="section"><h2 id="clavier-title">The Well-Tempered Clavier, Book I</h2><span class="meta">24 pairs</span></div>
<div id="clavier" aria-labelledby="clavier-title"></div>
<footer><span>Scores from Mutopia, Project Gutenberg, and Knute Snortum</span><a href="bach-data/piano-credits.txt">Piano recordings by Alexander Holm</a><a href="bach-data/ensemble-credits.txt">Organ and string recordings</a><a href="bach-data/concerto-credits.txt">Concerto recordings</a></footer>
</main>
<script src="bach-data/scores.js"></script><script src="bach-data/sinfonias.js"></script><script src="bach-data/preludes.js"></script><script src="bach-data/organ-work.js"></script><script src="bach-data/air-work.js"></script><script src="bach-data/brandenburg.js"></script><script src="bach-data/wtc1.js"></script><script src="bach-data/library.js"></script>
<script>
const portraits = [];
const features = [
    [1050, 'I. Allegro · D major', 'Brandenburg Concerto No. 5'],
    [565, 'Organ · D minor', 'Toccata and Fugue'],
    [1068, 'Orchestral Suite No. 3 · D major', 'Air'],
    [1007, 'Cello Suite No. 1 · G major', 'Prelude for solo cello'],
    [846, 'The Well-Tempered Clavier · Book I', 'Prelude in C major'],
    [851, 'The Well-Tempered Clavier · Book I', 'Fugue in D minor']
];
for (const [bwv, collection, title] of features) {
    const piece = library.find(work => work.bwv === bwv);
    const card = document.createElement('a');
    card.className = 'feature';
    card.href = playerLink(piece);
    card.innerHTML = '<span class="eyebrow"></span><h3></h3><canvas aria-hidden="true"></canvas><span class="meta"></span>';
    card.querySelector('.eyebrow').textContent = collection;
    card.querySelector('h3').textContent = title;
    card.querySelector('.meta').textContent = 'BWV ' + bwv + ' · ' + durationText(piece);
    document.querySelector('#featured-works').append(card);
    portraits.push([card.querySelector('canvas'), piece, true]);
}
const grids = [
    {pieces: INVENTIONS, grid: '#works', count: '#count'},
    {pieces: SINFONIAS, grid: '#sinfonias', count: '#sinfonia-count'}
];
for (const {pieces, grid, count} of grids) {
    const works = document.querySelector(grid);
    document.querySelector(count).textContent = pieces.length + ' works';
    for (const [index, piece] of pieces.entries()) {
        const row = document.createElement('a');
        row.className = 'work';
        row.href = playerLink(piece);
        row.innerHTML = '<span class="number"></span><div><h3></h3><div class="meta"></div></div><canvas aria-hidden="true"></canvas><span class="time"></span>';
        row.querySelector('.number').textContent = String(index+1).padStart(2,'0');
        row.querySelector('h3').textContent = piece.key;
        row.querySelector('.meta').textContent = 'BWV ' + piece.bwv;
        row.querySelector('.time').textContent = durationText(piece);
        row.setAttribute('aria-label', piece.title + ' in ' + piece.key + ', BWV ' + piece.bwv);
        works.append(row);
        portraits.push([row.querySelector('canvas'), piece]);
    }
}

for (const [index, pair] of clavierPairs.entries()) {
    const [prelude, fugue] = pair;
    const row = document.createElement('div');
    row.className = 'pair';
    row.innerHTML = '<div><h3></h3><small></small></div>';
    row.querySelector('h3').textContent = (index + 1) + '. ' + prelude.key;
    row.querySelector('small').textContent = 'BWV ' + prelude.bwv;
    for (const piece of pair) {
        const link = document.createElement('a');
        const detail = document.createElement('small');
        const isFugue = piece === fugue;
        link.href = playerLink(piece);
        const label = document.createElement('span');
        label.textContent = isFugue ? 'Fugue' : 'Prelude';
        link.setAttribute('aria-label', label.textContent + ' in ' + piece.key + ', BWV ' + piece.bwv);
        detail.textContent = (isFugue ? new Set(voiceGroups(piece)).size + ' voices · ' : '') + durationText(piece);
        label.append(detail);
        const canvas = document.createElement('canvas');
        canvas.setAttribute('aria-hidden', 'true');
        link.append(label, canvas);
        portraits.push([canvas, piece]);
        row.append(link);
    }
    document.querySelector('#clavier').append(row);
}

// The small portraits use actual note onsets from each score.
function portrait(canvas, piece, featured) {
    const w=canvas.clientWidth, h=canvas.clientHeight, scale=devicePixelRatio;
    canvas.width=Math.round(w*scale); canvas.height=Math.round(h*scale);
    const ctx=canvas.getContext('2d');
    ctx.scale(scale,scale);
    const start=featured && piece === FUGUE ? 60 : 0, span=featured?62:52;
    const parts=piece.score.map(part=>part.filter(([tick])=>tick>=start&&tick<start+span));
    const notes=parts.flat().flatMap(note=>note.slice(2));
    const lo=Math.min(...notes),hi=Math.max(...notes);
    parts.forEach((part,i)=>{
        let prev;
        ctx.strokeStyle=ctx.fillStyle=voiceColors[voiceGroups(piece)[i]];
        for (const [tick, length, ...pitches] of part) {
            const x = 3 + (tick-start)*(w-7)/span;
            const ys = pitches.sort((a,b) => a-b).map(pitch => h-5-(pitch-lo)*(h-10)/(hi-lo||1));
            ys.forEach((y, index) => {
                if (prev && tick <= prev.end+.1) {
                    ctx.globalAlpha=.65;
                    ctx.beginPath();
                    ctx.moveTo(prev.x, prev.ys[Math.min(index, prev.ys.length-1)]);
                    ctx.lineTo(x,y);
                    ctx.stroke();
                }
                ctx.globalAlpha=.86;ctx.beginPath();ctx.arc(x,y,featured?2.4:1.2,0,2*Math.PI);ctx.fill();
            });
            prev={x,ys,end:tick+length};
        }
    });
}
const observer=new ResizeObserver(()=>{
    portraits.forEach(([canvas, piece, featured]) => portrait(canvas, piece, featured));
});
observer.observe(document.querySelector('main'));
</script></html>
